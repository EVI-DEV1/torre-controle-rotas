<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Torre de Controle</title>
<style>
:root{
  --bg:#0a1017; --bg2:#0e1620; --panel:#111c28; --panel2:#152232; --line:#1e3247;
  --line2:#27435e; --txt:#dce8f5; --txt2:#8aa4bf; --txt3:#5b7690;
  --cy:#22d3ee; --gr:#22c55e; --am:#f59e0b; --rd:#ef4444; --vi:#a78bfa; --or:#fb923c; --pk:#f472b6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:13px/1.45 "Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.mono{font-family:"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:var(--txt);background:var(--bg2);border:1px solid var(--line);
  border-radius:6px;padding:6px 9px;width:100%}
select{cursor:pointer}
a{color:var(--cy)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- SHELL ---------- */
#app{display:grid;grid-template-columns:212px 1fr;grid-template-rows:56px 1fr 40px;height:100vh;
  grid-template-areas:"brand top" "nav main" "nav foot"}
#brand{grid-area:brand;display:flex;align-items:center;gap:9px;padding:0 14px;
  background:var(--bg2);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#brand .logo{width:26px;height:26px;flex:0 0 26px}
#brand h1{font-size:12.5px;font-weight:700;letter-spacing:.055em;line-height:1.15}
#brand small{display:block;font-size:8.5px;font-weight:600;color:var(--cy);letter-spacing:.13em}
#top{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 16px;
  background:var(--bg2);border-bottom:1px solid var(--line)}
#top .crumb{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--txt2)}
#top .crumb b{color:var(--txt)}
.tchip{display:flex;align-items:center;gap:8px;padding:5px 11px;background:var(--panel);
  border:1px solid var(--line);border-radius:7px}
.tchip .k{font-size:9px;color:var(--txt2);letter-spacing:.07em;font-weight:600}
.tchip .v{font-size:12.5px;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gr);flex:0 0 7px;
  box-shadow:0 0 0 3px rgba(34,197,94,.16)}
.dot.pulse{animation:pl 1.8s ease-out infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(34,197,94,.45)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

#nav{grid-area:nav;background:var(--bg2);border-right:1px solid var(--line);
  overflow-y:auto;display:flex;flex-direction:column}
.navsec{font-size:8.5px;font-weight:700;letter-spacing:.15em;color:var(--txt3);padding:16px 16px 7px}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 16px;color:var(--txt2);
  font-size:12.5px;width:100%;text-align:left;border-left:2px solid transparent}
.navitem:hover{background:var(--panel);color:var(--txt)}
.navitem.on{background:linear-gradient(90deg,rgba(34,211,238,.14),transparent);
  color:var(--cy);border-left-color:var(--cy);font-weight:600}
.navitem svg{width:15px;height:15px;flex:0 0 15px;stroke-width:1.9}
.navitem .badge{margin-left:auto;background:var(--rd);color:#fff;font-size:9px;font-weight:700;
  padding:1px 6px;border-radius:9px}
#main{grid-area:main;overflow-y:auto;overflow-x:hidden;padding:14px;min-width:0}
#foot{grid-area:foot;display:flex;align-items:center;gap:22px;padding:0 16px;font-size:10.5px;
  color:var(--txt2);background:var(--bg2);border-top:1px solid var(--line)}
#foot b{color:var(--txt);font-weight:600}

/* ---------- PRIMITIVES ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.card>h3{font-size:10.5px;font-weight:700;letter-spacing:.11em;color:var(--txt2);
  padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card>h3 .r{margin-left:auto;font-weight:600;letter-spacing:.02em;color:var(--txt3)}
.card>h3>svg{width:14px;height:14px;flex:0 0 14px;stroke-width:2}
.pad{padding:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--c,var(--cy))}
.kpi .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 30px;
  background:color-mix(in srgb,var(--c,var(--cy)) 15%,transparent);color:var(--c,var(--cy))}
.kpi .ic svg{width:16px;height:16px;stroke-width:2}
.kpi .k{font-size:8.5px;font-weight:700;letter-spacing:.09em;color:var(--txt2);white-space:nowrap}
.kpi .v{font-size:20px;font-weight:700;line-height:1.1;color:var(--c,var(--txt))}
.kpi.sm .v{font-size:16px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:9px;font-weight:700;letter-spacing:.09em;color:var(--txt2);text-align:left;
  padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;background:var(--panel);z-index:2}
td{padding:7px 10px;border-bottom:1px solid rgba(30,50,71,.5);white-space:nowrap}
tbody tr:hover{background:var(--panel2)}
tbody tr.sel{background:rgba(34,211,238,.10)}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:9.5px;font-weight:700;
  letter-spacing:.05em;white-space:nowrap}
.t-gr{background:rgba(34,197,94,.17);color:#4ade80}
.t-am{background:rgba(245,158,11,.17);color:#fbbf24}
.t-rd{background:rgba(239,68,68,.17);color:#f87171}
.t-cy{background:rgba(34,211,238,.15);color:#67e8f9}
.t-vi{background:rgba(167,139,250,.17);color:#c4b5fd}
.t-or{background:rgba(251,146,60,.17);color:#fdba74}
.t-gy{background:rgba(139,164,191,.14);color:var(--txt2)}
.bar{height:5px;border-radius:3px;background:var(--bg);overflow:hidden;min-width:52px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--gr)}
.muted{color:var(--txt2)}.small{font-size:11px}.tiny{font-size:10px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.btn{padding:7px 13px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);
  font-size:11.5px;font-weight:600;color:var(--txt2)}
.btn:hover{border-color:var(--cy);color:var(--cy)}
.btn.pri{background:var(--cy);color:#062630;border-color:var(--cy)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.on{background:rgba(34,211,238,.15);border-color:var(--cy);color:var(--cy)}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:9px;font-weight:700;letter-spacing:.09em;color:var(--txt2);margin-bottom:4px}
.empty{padding:34px 16px;text-align:center;color:var(--txt3);font-size:12px}
.scroll{overflow:auto}
</style>
<style>
/* ---------- DASHBOARD ---------- */
#dash{display:grid;gap:12px;grid-template-columns:minmax(0,1fr) 296px;
  grid-template-areas:"kpi kpi" "kpi2 kpi2" "map alert" "bot alert";align-items:start}
#dash>*{min-width:0}
#dash>.kpis{grid-area:kpi;margin:0}
.card{min-width:0}
#mapwrap{grid-area:map;position:relative;height:498px;background:var(--bg2);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
#mapwrap.edit{border-color:var(--cy);box-shadow:0 0 0 1px rgba(34,211,238,.35) inset}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:grab;display:block}
#cv.drag{cursor:grabbing}
.mapui{position:absolute;z-index:5}
#msearch{top:11px;left:11px;width:264px}
#msearch input{background:rgba(14,22,32,.94);border-color:var(--line2);padding-left:30px;
  backdrop-filter:blur(6px)}
#msearch svg{position:absolute;left:9px;top:8px;width:14px;height:14px;color:var(--txt2)}
#mres{margin-top:4px;background:rgba(14,22,32,.97);border:1px solid var(--line2);border-radius:7px;
  max-height:210px;overflow:auto;display:none}
#mres button{display:block;width:100%;text-align:left;padding:7px 10px;font-size:11.5px;
  border-bottom:1px solid var(--line)}
#mres button:hover{background:var(--panel2);color:var(--cy)}
#mzoom{top:56px;left:11px;display:flex;flex-direction:column;gap:5px}
#mzoom button{width:31px;height:31px;background:rgba(14,22,32,.94);border:1px solid var(--line2);
  border-radius:7px;display:grid;place-items:center;color:var(--txt2);backdrop-filter:blur(6px)}
#mzoom button:hover{color:var(--cy);border-color:var(--cy)}
#mzoom svg{width:15px;height:15px;stroke-width:2}
#mlayers{top:11px;right:11px;width:186px;background:rgba(14,22,32,.95);border:1px solid var(--line2);
  border-radius:9px;backdrop-filter:blur(7px);overflow:hidden}
#mlayers h4{font-size:8.5px;font-weight:700;letter-spacing:.13em;color:var(--txt2);
  padding:9px 11px;border-bottom:1px solid var(--line)}
#mlayers .ly{display:flex;align-items:center;gap:8px;padding:4.5px 11px;font-size:11px;cursor:pointer}
#mlayers .ly:hover{background:var(--panel2)}
#mlayers .ly input{width:13px;height:13px;accent-color:var(--cy);cursor:pointer;flex:0 0 13px}
#mlayers .ly .sw{width:11px;height:11px;border-radius:3px;flex:0 0 11px}
#mscale{bottom:11px;left:11px;font-size:9.5px;color:var(--txt2);background:rgba(14,22,32,.9);
  padding:3px 8px;border-radius:5px;border:1px solid var(--line)}
#mscale .ln{display:inline-block;height:5px;border-left:1.5px solid var(--txt2);
  border-right:1.5px solid var(--txt2);border-bottom:1.5px solid var(--txt2);
  vertical-align:middle;margin-right:6px}
#mtip{position:absolute;z-index:9;pointer-events:none;display:none;max-width:250px;
  background:rgba(8,14,20,.97);border:1px solid var(--line2);border-radius:7px;padding:7px 10px;
  font-size:11px;box-shadow:0 8px 22px rgba(0,0,0,.55)}
#mtip b{display:block;margin-bottom:2px;color:var(--cy);font-size:11.5px}
#mtip .l{color:var(--txt2);font-size:10px}

#alerts{grid-area:alert;display:flex;flex-direction:column;gap:12px}
#alist{max-height:432px;overflow-y:auto}
.al{display:flex;gap:9px;padding:9px 12px;border-bottom:1px solid rgba(30,50,71,.55);
  cursor:pointer;border-left:2px solid transparent}
.al:hover{background:var(--panel2)}
.al.on{border-left-color:var(--cy);background:rgba(34,211,238,.07)}
.al .ic{width:15px;height:15px;flex:0 0 15px;margin-top:1px}
.al .ic svg{width:15px;height:15px;stroke-width:2}
.al .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.al .tt{font-size:11.5px;font-weight:600;line-height:1.3;display:block}
.al .ds{font-size:10.5px;color:var(--txt2);margin-top:2px;line-height:1.35;display:block}
.al .hh{font-size:9.5px;color:var(--txt3);flex:0 0 auto}
.sev-3{color:var(--rd)}.sev-2{color:var(--am)}.sev-1{color:var(--cy)}

#sel .kv{display:flex;justify-content:space-between;gap:10px;padding:3.5px 0;font-size:11.5px}
#sel .kv .k{color:var(--txt2)}
#sel .kv .v{font-weight:600;text-align:right}
#bot{grid-area:bot;display:grid;grid-template-columns:minmax(0,1fr) 328px;gap:12px;align-items:start}
#bot>*{min-width:0}
#divtbl{max-height:266px;overflow:auto}
#donut{display:flex;align-items:center;gap:14px}
#donut svg{width:132px;height:132px;flex:0 0 132px}
#dlg{flex:1;display:flex;flex-direction:column;gap:6px}
#dlg .li{display:flex;align-items:center;gap:8px;font-size:11.5px}
#dlg .sw{width:11px;height:11px;border-radius:3px;flex:0 0 11px}
#dlg .vv{margin-left:auto;font-weight:700}

/* ---------- PAGES ---------- */
.page h2{font-size:16px;font-weight:700;letter-spacing:.01em;margin-bottom:2px}
.page .sub{font-size:11.5px;color:var(--txt2);margin-bottom:13px;max-width:820px;line-height:1.55}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters .fld{margin:0;min-width:148px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.split3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.prov{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;
  letter-spacing:.06em;padding:2px 6px;border-radius:4px}
.p-conf{background:rgba(34,197,94,.15);color:#4ade80}
.p-deriv{background:rgba(34,211,238,.15);color:#67e8f9}
.p-indef{background:rgba(245,158,11,.16);color:#fbbf24}
.p-diverg{background:rgba(239,68,68,.16);color:#f87171}
.note{border-left:2.5px solid var(--am);background:rgba(245,158,11,.07);padding:10px 13px;
  border-radius:0 7px 7px 0;font-size:11.5px;line-height:1.55;margin-bottom:12px}
.note b{color:#fbbf24}
.note.cy{border-color:var(--cy);background:rgba(34,211,238,.06)}
.note.cy b{color:#67e8f9}
.note.rd{border-color:var(--rd);background:rgba(239,68,68,.07)}
.note.rd b{color:#f87171}
.tl{position:relative;padding-left:19px}
.tl::before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:1.5px;background:var(--line2)}
.tl .ev{position:relative;padding:7px 0}
.tl .ev::before{content:"";position:absolute;left:-17.5px;top:12px;width:8px;height:8px;
  border-radius:50%;background:var(--panel);border:2px solid var(--c,var(--cy))}
@media(max-width:1180px){
  #dash{grid-template-columns:1fr;grid-template-areas:"kpi" "kpi2" "map" "alert" "bot"}
  #bot{grid-template-columns:1fr}
  #alist{max-height:300px}
}

/* ---------- ADMIN ---------- */
textarea{font:inherit;color:var(--txt);background:var(--bg2);border:1px solid var(--line);
  border-radius:6px;padding:6px 9px;width:100%;resize:vertical}
input.mini,select.mini{padding:3px 6px;border-radius:5px;font-size:11px;width:auto;min-width:58px}
.btn.tiny{padding:3px 8px;font-size:10.5px;border-radius:5px}
.diabar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:12px}
.diabar.cp{padding:7px 9px;margin:0}
.fluxo{display:flex;align-items:center;gap:6px}
.passo{font-size:8.5px;font-weight:700;letter-spacing:.09em;color:var(--txt3)}
.passo.on{color:var(--txt2)}
.passo.cur{color:var(--cy)}
.seta{color:var(--line2);font-size:11px}
.gav{position:fixed;inset:0;z-index:60;background:rgba(4,8,12,.62);display:flex;
  justify-content:flex-end;backdrop-filter:blur(2px)}
.gavbox{width:432px;max-width:94vw;height:100%;background:var(--panel);
  border-left:1px solid var(--line2);overflow-y:auto;box-shadow:-14px 0 40px rgba(0,0,0,.5)}
.gavbox>h3{position:sticky;top:0;background:var(--panel);z-index:2}
.itrow{display:flex;align-items:center;gap:6px;padding:6px 9px;
  border-bottom:1px solid rgba(30,50,71,.5)}
.itrow:hover{background:var(--panel2)}
.itrow .num{width:22px;flex:0 0 22px;color:var(--txt3);font-size:10.5px}
#toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%) translateY(14px);z-index:80;
  padding:10px 16px;border-radius:9px;font-size:12px;font-weight:600;opacity:0;
  pointer-events:none;transition:.22s;max-width:min(560px,92vw);text-align:center;
  border:1px solid var(--line2);background:var(--panel2);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.cy{border-color:var(--cy);color:#67e8f9}
#toast.gr{border-color:var(--gr);color:#4ade80}
#toast.am{border-color:var(--am);color:#fbbf24}
#toast.rd{border-color:var(--rd);color:#f87171}
#mpsel{bottom:11px;right:11px;width:250px;background:rgba(14,22,32,.96);
  border:1px solid var(--cy);border-radius:9px;backdrop-filter:blur(7px);padding:10px 12px}
#mpsel b{display:block;color:var(--cy);font-size:11.5px;margin-bottom:3px}
#btnEdit.on{background:rgba(34,211,238,.16);border-color:var(--cy);color:var(--cy)}
.selpapel{background:var(--panel);border:1px solid var(--line);border-radius:7px;
  padding:5px 9px;font-size:11.5px;font-weight:600;width:auto;cursor:pointer}

/* ==================== FOLHA DE RUA ====================
   As regras visuais da folha valem na tela E no papel. O que muda entre os
   dois é só a visibilidade e o tamanho de página. */
#print{display:none}
body.folhaview #print{display:block;position:fixed;inset:0;z-index:90;
  background:#4a5568;overflow-y:auto;padding:22px 16px 60px}
body.folhaview #app,body.folhaview #gaveta,body.folhaview #mtip{display:none}
#folhabar{position:fixed;left:0;right:0;top:0;z-index:95;display:none;
  align-items:center;gap:12px;padding:9px 16px;background:var(--panel);
  border-bottom:1px solid var(--line2);font-size:12px}
body.folhaview #folhabar{display:flex}
#folhabar b{color:var(--am)}
body.folhaview #print{padding-top:64px}

.folha{background:#fff;color:#000;font:11pt/1.35 "Segoe UI",Arial,sans-serif;
  width:186mm;margin:0 auto 18px;padding:14mm 12mm;position:relative;
  box-shadow:0 6px 24px rgba(0,0,0,.4)}
.folha header{display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:2.5pt solid #000;padding-bottom:3mm;margin-bottom:3.5mm}
.folha h1{font-size:17pt;letter-spacing:.06em;margin:0;font-weight:800}
.folha .hr{text-align:right}
.folha .frente{font-size:12.5pt;font-weight:800;letter-spacing:.04em}
.folha .hd{font-size:10pt;font-weight:600}
.folha .carimbo{border:2.5pt solid #000;padding:2mm 3mm;text-align:center;font-weight:800;
  font-size:11pt;letter-spacing:.05em;margin-bottom:3.5mm}
.folha table{width:100%;border-collapse:collapse}
.folha .cab{margin-bottom:3mm;font-size:10pt}
.folha .cab th{text-align:left;font-size:8pt;letter-spacing:.06em;text-transform:uppercase;
  width:31mm;padding:1.4mm 2mm 1.4mm 0;vertical-align:top;font-weight:700;
  background:none;position:static;border:0;color:#000}
.folha .cab td{padding:1.4mm 4mm 1.4mm 0;vertical-align:top;border:0;white-space:normal}
.folha .preencher{color:#333;letter-spacing:.02em}
.folha .recado{border-left:2.5pt solid #000;padding:1.5mm 0 1.5mm 3mm;margin-bottom:3mm;font-size:10pt}
.folha .paradas{font-size:10pt;border-top:1.2pt solid #000}
.folha .paradas th{font-size:7.5pt;letter-spacing:.05em;text-align:center;padding:1.6mm 1mm;
  border-bottom:1.2pt solid #000;font-weight:700;background:none;position:static;color:#000}
.folha .paradas th.pt{text-align:left}
.folha .paradas td{border-bottom:.5pt solid #999;padding:2.1mm 1mm;vertical-align:top;
  white-space:normal;color:#000}
.folha .paradas tr:hover{background:none}
.folha .paradas .n{width:8mm;text-align:center;font-weight:700}
.folha .paradas .pt b{display:block;font-weight:600}
.folha .paradas .cod{display:block;font-size:7.5pt;color:#555;letter-spacing:.03em}
.folha .paradas .bx{width:15mm;border-left:.5pt solid #999}
.folha .paradas .mo{width:44mm;border-left:.5pt solid #999}
.folha .paradas .vazio{text-align:center;padding:8mm;color:#555}
.folha .rodape{margin-top:4mm;font-size:8.5pt;border-top:1.2pt solid #000;padding-top:2.5mm}
.folha .bloco{margin-bottom:2mm}
.folha .bloco b{font-size:7.5pt;letter-spacing:.06em;text-transform:uppercase;margin-right:2mm}

/* ---- geometria ---- */
const RT = 6371000, rad = d => d * Math.PI / 180;
function hav(a, b, c, d) { const x = rad(c - a), y = rad(d - b);
  const h = Math.sin(x/2)**2 + Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(y/2)**2;
  return 2 * RT * Math.asin(Math.sqrt(h)); }
function inRing(la, lo, ring) { let i2 = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const yi = ring[i][0], xi = ring[i][1], yj = ring[j][0], xj = ring[j][1];
    if (((yi > la) !== (yj > la)) && (lo < (xj - xi) * (la - yi) / (yj - yi) + xi)) i2 = !i2; }
  return i2; }
function bairroDe(la, lo) { for (const b of D.bairros) for (const r of b.rings)
    if (inRing(la, lo, r)) return b.nome; return null; }
const BMAP = Object.fromEntries(D.bairros.map(b => [b.nome, b]));

/* ---- RNG determinístico: mesma data ⇒ mesma simulação ---- */
function hash(s) { let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0; }
function rng(seed) { let s = seed >>> 0;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

/* ---- ordenação de rota: vizinho mais próximo a partir de um ponto ---- */
function rotaVizinho(pts, la0, lo0) {
  const rest = pts.slice(), out = []; let cla = la0, clo = lo0;
  while (rest.length) { let bi = 0, bd = Infinity;
    for (let i = 0; i < rest.length; i++) { const d = hav(cla, clo, rest[i].lat, rest[i].lon);
      if (d < bd) { bd = d; bi = i; } }
    const p = rest.splice(bi, 1)[0]; out.push(p); cla = p.lat; clo = p.lon; }
  return out; }
const hm2min = h => +h.slice(0,2)*60 + +h.slice(3,5);
const min2hm = m => String(Math.floor(((m%1440)+1440)%1440/60)).padStart(2,'0') + ':' +

const PAPEIS = [

];
const ACOES = ['verCampo','editarAtividade','editarEquipe','editarItinerario','confirmar','liberar','reabrir'];

/* função pura — é ela que a integração liga ao papel real da sessão */
function pode(papel, acao) {
  if (acao === 'verCampo') return true;
  if (papel === 'admin') return ACOES.includes(acao);
  if (papel === 'supervisor') return acao === 'editarAtividade';
  return false;
}

   Ciclo do SPEC §4:  PROPOSTA → AJUSTADO → CONFIRMADO → LIBERADO
   Regra que já é código na Torre: ajustar um dia confirmado TIRA O DIA DO AR
   (volta para AJUSTADO e sobe a versão). Aqui é igual — o app não briga com
   o comportamento de produção.
   ========================================================================== */
const CICLO = ['PROPOSTA','AJUSTADO','CONFIRMADO','LIBERADO'];
const CICLO_TAG = { PROPOSTA:'t-gy', AJUSTADO:'t-am', CONFIRMADO:'t-cy', LIBERADO:'t-gr' };
const EDIT = {};                     // { iso: {estado, versao, equipes, itin, atividades, log, ...} }
const LSKEY = 'torre-controle-edicoes-v1';

function diaEdit(iso) {
  if (!EDIT[iso]) EDIT[iso] = { estado:'PROPOSTA', versao:1, confirmadoEm:null, liberadoEm:null,
    equipes:{}, itin:{}, novas:[], removidas:[], atividades:null, log:[] };
  return EDIT[iso];
}
const estadoDia  = iso => diaEdit(iso).estado;
const noAr       = iso => estadoDia(iso) === 'LIBERADO';

function registra(iso, acao, detalhe) {
  diaEdit(iso).log.unshift({ hora:min2hm(ST.hora), papel:ST.papel, acao, detalhe });
  if (diaEdit(iso).log.length > 300) diaEdit(iso).log.length = 300;
}
/* toda mutação passa por aqui: derruba o dia do ar se ele já estava no ar */
function mutou(iso, acao, detalhe) {
  const d = diaEdit(iso);
  if (d.estado === 'CONFIRMADO' || d.estado === 'LIBERADO') {
    d.estado = 'AJUSTADO'; d.versao++; d.liberadoEm = null; d.confirmadoEm = null;
    registra(iso, 'DIA TIRADO DO AR', 'alteração em dia ' + (d.liberadoEm ? 'liberado' : 'confirmado') +
      ' — voltou para AJUSTADO, versão ' + d.versao + ' (SPEC §4)');
    aviso('O dia saiu do ar. Confirme e libere de novo para o campo enxergar.', 'am');
  }
  registra(iso, acao, detalhe);
  ST.dirty = true;          // força o plano a ser remontado no próximo ciclo
  salvaEdicoes();
}
function salvaEdicoes() { try { localStorage.setItem(LSKEY, JSON.stringify(EDIT)); } catch (_) {} }

  try { const j = JSON.parse(localStorage.getItem(LSKEY) || '{}');

  lat:b.lat, lon:b.lon, tipo:'windbanner', score:b.score, bairro:b.regiao, elegivel:b.elegivel });
const TIPO_FRENTE = { rua:'PAP', feira:'FEI', semaforo:'SEM', windbanner:'WIN' };

/* Aplica em cima do plano gerado tudo que o ADMIN alterou para o dia. */
function aplicaEdicoes(eqs, iso) {
  const d = EDIT[iso]; if (!d) { eqs.forEach(e => e.membros = e.membros || []); return eqs; }
  (d.novas || []).forEach(n => eqs.push({ id:n.id, frente:n.frente, nome:n.nome,
    quad:n.quad || null, bairro:n.bairro || '—', regiao:'—', rota:n.rota || n.id,
    ini:n.ini, fim:n.fim, pessoas:n.pessoas != null ? n.pessoas : 2, pontos:[], criadaPeloAdmin:true }));
  const out = eqs.filter(e => !(d.removidas || []).includes(e.id));
  out.forEach(e => {
    const o = d.equipes[e.id];
    if (o) {
      if (o.nome)          e.nome    = o.nome;
      if (o.ini)           e.ini     = o.ini;
      if (o.fim)           e.fim     = o.fim;
      if (o.pessoas != null) e.pessoas = o.pessoas;
      if (o.membros)       e.membros = o.membros;
      if (o.obs != null)   e.obs     = o.obs;
      e.editada = true;
    }
    e.membros = e.membros || [];
    const it = d.itin[e.id];
    if (it) {
      e.pontos = it.map(id => CAT[id]).filter(Boolean).map(p => Object.assign({}, p));
      e.itinEditado = true;
      if (e.frente === 'WIN') e.rota = 'W' + e.id.slice(1) + ' · ' + e.pontos.length + ' pts';
    }
  });
  return out;
}

function planoDoDia(iso) {
  const wd = wdOf(iso), di = diaIdx(iso), eqs = [];
  if (di < 0) return { data:iso, wd, equipes:[], quad:null, fora:true };

  /* ---------- PORTA A PORTA (Coord. A) — 1 quadrante/dia, calendário do dado ---------- */
  const quad = D.quadrantes.find(q => q.data === iso) || null;
  if (quad) {
    const rs = rotaVizinho(RUAS_Q[quad.id] || [], quad.cent[0], quad.cent[1]);
    const nd = FR.PAP.equipes, per = Math.ceil(rs.length / nd);
    for (let i = 0; i < nd; i++) {
      const chunk = rs.slice(i * per, (i + 1) * per);
      if (!chunk.length) continue;
      eqs.push({ id:'J' + (i+1), frente:'PAP', nome:'Dupla J' + (i+1), quad:quad.id,
        bairro:quad.bairro, regiao:quad.regiao, rota:quad.id + '/D' + (i+1),
        ini:FR.PAP.ini, fim:FR.PAP.fim, pessoas:2,
        pontos: chunk.map(r => ({ id:r.id, nome:r.nome, lat:r.lat, lon:r.lon,
          a:r.a, b:r.b, m:r.m, tipo:'rua' })) });
    }
  }

  /* ---------- FEIRAS (Coord. C) — feiras elegíveis do dia da semana ---------- */
  const fdia = FEIRAS_ELEG.filter(f => f.dia === wd).slice(0, FR.FEI.cap);
  fdia.forEach((f, i) => eqs.push({
    id:'S' + (i+1), frente:'FEI', nome:'Dupla S' + (i+1), quad:null,
    bairro:f.bairro, regiao:'campo aberto', rota:f.id,
    ini:(f.horario || '07:00-14:00').split('-')[0],
    fim:(f.horario || '07:00-14:00').split('-')[1],
    pessoas:2, pessoasProv:'INDEFINIDO',
    pontos:[{ id:f.id, nome:f.nome, lat:f.lat, lon:f.lon, tipo:'feira', horario:f.horario }] }));

  /* ---------- SEMÁFOROS (Coord. B) — rotação de 5/dia sobre os 116 elegíveis ---------- */
  const off = (di * FR.SEM.cap) % SEM_ELEG.length;
  const sdia = Array.from({ length:FR.SEM.cap }, (_, k) => SEM_ELEG[(off + k) % SEM_ELEG.length]);
  sdia.forEach((s, i) => eqs.push({
    id:'C' + (i+1), frente:'SEM', nome:'Dupla C' + (i+1), quad:null,
    bairro:s.bairroRef, regiao:s.regiao, rota:s.id,
    ini:'12:00', fim:'18:30', pessoas:2, pessoasProv:'INDEFINIDO',
    pontos:[{ id:s.id, nome:s.cruzamento, lat:s.lat, lon:s.lon, tipo:'semaforo', score:s.score }] }));

  /* ---------- WINDBANNER (Coord. D) — rotação de 20/dia sobre os elegíveis ---------- */
  const woff = (di * FR.WIN.cap) % WIN_ELEG.length;
  const wdia = Array.from({ length:FR.WIN.cap }, (_, k) => WIN_ELEG[(woff + k) % WIN_ELEG.length]);
  const meia = wdia.length / FR.WIN.equipes;
  for (let i = 0; i < FR.WIN.equipes; i++) {
    const chunk = wdia.slice(i * meia, (i + 1) * meia);
    if (!chunk.length) continue;
    const ord = rotaVizinho(chunk, chunk[0].lat, chunk[0].lon);
    eqs.push({ id:'V' + (i+1), frente:'WIN', nome:'Equipe V' + (i+1), quad:null,
      bairro:'—', regiao:[...new Set(chunk.map(c => c.regiao))].join('/'),
      rota:'W' + (i+1) + ' · ' + ord.length + ' pts', ini:'06:00', fim:'10:00', pessoas:3,
      pontos: ord.map(p => ({ id:p.id, nome:p.via + (p.ref ? ' · ' + p.ref : ''),
        lat:p.lat, lon:p.lon, tipo:'windbanner', score:p.score })) });
  }

  /* ---------- o que o ADMIN alterou entra aqui, antes de qualquer medição ---------- */
  const eqsF = aplicaEdicoes(eqs, iso);

  /* ---------- perfil de simulação: determinístico por (equipe, data) ---------- */
  eqsF.forEach(e => {
    const r = rng(hash(e.id + iso));
    e.pontos.forEach((p, i) => { p.ordem = i + 1; });
    e.iniMin = hm2min(e.ini); e.fimMin = hm2min(e.fim);
    if (e.fimMin <= e.iniMin) e.fimMin = e.iniMin + 60;
    e.sim = {
      ritmo:       0.80 + r() * 0.40,
      desvio:      r() < 0.16 ? 60 + r() * 320 : 0,
      desvioAng:   r() * Math.PI * 2,
      gpsIni:      r() < 0.13 ? e.iniMin + 40 + r() * 260 : null,
      gpsDur:      4 + r() * 11,
      parouEm:     r() < 0.20 ? e.iniMin + 60 + r() * 240 : null,
      parouDur:    18 + r() * 30,
      atrasoSaida: r() < 0.24 ? Math.round(8 + r() * 40) : 0
    };
  });
  return { data:iso, wd, equipes:eqsF, quad, fora:false,
    feirasDia:  D.feiras.filter(f => f.dia === wd),
    feirasBloq: D.feiras.filter(f => f.dia === wd && f.emEscopo && f.dentroPaP) };
}

/* ==========================================================================
   SIMULAÇÃO DE GPS + DETECÇÃO (prompt §3)
   A posição é simulada; o STATUS não é — ele é medido a partir do rastro,
   exatamente como seria medido com GPS real.
   ========================================================================== */
function pontoNaRota(e, f) {
  const p = e.pontos; if (!p.length) return null;
  if (f <= 0) return { lat:p[0].lat, lon:p[0].lon, i:0 };
  if (f >= 1) return { lat:p[p.length-1].lat, lon:p[p.length-1].lon, i:p.length-1 };
  const x = f * (p.length - 1), i = Math.floor(x), t = x - i;
  const a = p[i], b = p[Math.min(i + 1, p.length - 1)];
  return { lat:a.lat + (b.lat - a.lat) * t, lon:a.lon + (b.lon - a.lon) * t, i };
}
const fracEsperada = (e, t) =>
  Math.max(0, Math.min(1, (t - e.iniMin) / Math.max(1, e.fimMin - e.iniMin)));

function estadoBruto(e, tmin) {
  const s = e.sim, dur = Math.max(1, e.fimMin - e.iniMin);
  let te = tmin - e.iniMin - s.atrasoSaida;
  if (s.parouEm != null && tmin > s.parouEm) te -= Math.min(s.parouDur, tmin - s.parouEm);
  return pontoNaRota(e, Math.max(0, Math.min(1, (te / dur) * s.ritmo)));
}
function trilhaDe(e, tmin) {
  const out = [];
  for (let t = e.iniMin; t <= tmin; t += 6) { const p = estadoBruto(e, t); if (p) out.push([p.lat, p.lon]); }
  return out;
}
function estado(e, tmin) {
  const s = e.sim, dur = Math.max(1, e.fimMin - e.iniMin);
  const fEsp = fracEsperada(e, tmin);
  let te = tmin - e.iniMin - s.atrasoSaida;
  if (s.parouEm != null && tmin > s.parouEm) te -= Math.min(s.parouDur, tmin - s.parouEm);
  const fReal = Math.max(0, Math.min(1, (te / dur) * s.ritmo));

  const plan = pontoNaRota(e, fEsp), real = pontoNaRota(e, fReal);
  if (!plan || !real) return null;

  const dlat = (s.desvio / 111320) * Math.cos(s.desvioAng);
  const dlon = (s.desvio / (111320 * Math.cos(rad(real.lat)))) * Math.sin(s.desvioAng);
  const pos = { lat:real.lat + dlat, lon:real.lon + dlon };

  let gpsIdade = 4 + (hash(e.id) % 9);
  if (s.gpsIni != null && tmin >= s.gpsIni && tmin <= s.gpsIni + s.gpsDur)
    gpsIdade = Math.round((tmin - s.gpsIni) * 60);

  let desvioM = Infinity;
  for (const p of e.pontos) desvioM = Math.min(desvioM, hav(pos.lat, pos.lon, p.lat, p.lon));
  desvioM = Math.round(desvioM);

  const antes = estadoBruto(e, tmin - CFG.paradaMin);
  const deslocou = antes ? hav(pos.lat, pos.lon, antes.lat, antes.lon) : 9999;
  // "Parada" é medida CONTRA O PRÓPRIO RITMO DA ROTA, não contra uma distância fixa.
  //  · rota de ponto único (feira, ação no cruzamento) é estacionária por natureza — ficar no
  //    ponto é a operação, não uma anomalia;
  //  · uma dupla de porta a porta varre a mesma rua por horas e anda pouquíssimo por
  //    minuto. Só é parada quem devia ter andado e não andou.
  const itinerante = e.pontos.length > 1;
  const eAntes = pontoNaRota(e, fracEsperada(e, tmin - CFG.paradaMin));
  const eAgora = pontoNaRota(e, fracEsperada(e, tmin));
  const espDesloc = (eAntes && eAgora) ? hav(eAntes.lat, eAntes.lon, eAgora.lat, eAgora.lon) : 0;
  const parado = itinerante && tmin > e.iniMin + CFG.paradaMin && tmin < e.fimMin &&
                 espDesloc > CFG.paradaRaio && deslocou < CFG.paradaRaio;
  const atraso = Math.max(0, Math.round((fEsp - fReal) * dur));
  const feitos = Math.min(e.pontos.length, Math.floor(fReal * e.pontos.length));
  const bairroAtual = bairroDe(pos.lat, pos.lon);
  const foraQuad = e.frente === 'PAP' && e.quad && bairroAtual !== QMAP[e.quad].bairro;

  let st = 'AGUARDANDO';
  if (tmin >= e.iniMin && tmin < e.fimMin) st = 'EM ROTA';
  if (tmin >= e.fimMin) st = fReal >= 0.999 ? 'CONCLUÍDA' : 'ENCERRADA INCOMPLETA';
  if (st === 'EM ROTA') {
    if      (gpsIdade > CFG.gpsOffline)  st = 'GPS OFFLINE';
    else if (desvioM  > CFG.tolDesvio)   st = 'FORA DA ROTA';
    else if (foraQuad)                   st = 'FORA DO QUADRANTE';
    else if (parado)                     st = 'PARADA';
    else if (atraso   > CFG.atrasoMin)   st = 'ATRASADA';
  }
  return { lat:pos.lat, lon:pos.lon, planLat:plan.lat, planLon:plan.lon,
    fEsp, fReal, feitos, total:e.pontos.length, atraso, desvioM, gpsIdade,
    parado, espDesloc:Math.round(espDesloc), foraQuad, bairroAtual, status:st, deslocou:Math.round(deslocou),
    pontoAtual: e.pontos[Math.min(feitos, e.pontos.length - 1)],
    trilha: trilhaDe(e, tmin) };
}

/* ==========================================================================
   MOTOR DE CONFLITOS E ALERTAS (prompt §4 + regras já vigentes do SPEC §3)
   ========================================================================== */
function alertas(plano, tmin, est) {
  const A = [], add = (sev, tipo, tt, ds, ref) =>
    A.push({ sev, tipo, tt, ds, ref, hora:min2hm(tmin) });
  const ativos = plano.equipes.filter(e => est[e.id] &&
    ['EM ROTA','ATRASADA','FORA DA ROTA','PARADA','GPS OFFLINE','FORA DO QUADRANTE']
      .includes(est[e.id].status));

  /* --- 1. estado individual da equipe --- */
  for (const e of plano.equipes) {
    const s = est[e.id]; if (!s) continue;
    if (s.status === 'FORA DA ROTA')
      add(3, 'rota', e.nome + ' fora da rota',
        s.desvioM + ' m da rota planejada (tolerância ' + CFG.tolDesvio + ' m) · ' + e.rota, e.id);
    if (s.status === 'FORA DO QUADRANTE')
      add(3, 'quadrante', e.nome + ' fora do quadrante',
        'planejada em ' + e.quad + ' (' + e.bairro + '), GPS em ' + (s.bairroAtual || 'fora dos 11 bairros'), e.id);
    if (s.status === 'GPS OFFLINE')
      add(3, 'gps', e.nome + ' com GPS offline',
        'sem posição há ' + Math.round(s.gpsIdade / 60) + ' min', e.id);
    if (s.status === 'PARADA')
      add(2, 'parada', e.nome + ' parada',
        'deslocou ' + s.deslocou + ' m em ' + CFG.paradaMin + ' min; a rota previa ' + s.espDesloc + ' m', e.id);
    if (s.status === 'ATRASADA')
      add(2, 'atraso', e.nome + ' atrasada',
        'atraso de ' + s.atraso + ' min na rota ' + e.rota, e.id);
    if (s.status === 'ENCERRADA INCOMPLETA')
      add(2, 'pendencia', e.nome + ' encerrou incompleta',
        (s.total - s.feitos) + ' de ' + s.total + ' pontos sem baixa — viram pendência (SPEC §4)', e.id);
  }

  /* --- 1b. o dia ainda não está no ar --- */
  const edia = diaEdit(plano.data);
  if (edia.estado !== 'LIBERADO' && plano.equipes.length)
    add(edia.estado === 'CONFIRMADO' ? 2 : 3, 'liberacao',
      'Dia em ' + edia.estado + ' — campo não enxerga',
      plano.equipes.length + ' equipes montadas, ' +
      plano.equipes.filter(e => !(e.membros || []).length).length + ' sem gente designada. ' +
      (edia.estado === 'CONFIRMADO' ? 'Falta liberar para a rua.' : 'Falta confirmar e liberar.'), null);
  const semDupla = plano.equipes.filter(e => !(e.membros || []).length);
  if (semDupla.length && edia.estado === 'LIBERADO')
    add(2, 'liberacao', semDupla.length + ' equipes liberadas sem gente designada',
      semDupla.map(e => e.nome).join(', ') + ' — não há cadastro de pessoas na origem', null);

  /* --- 2. duas equipes no mesmo bairro (prompt §4) --- */
  const porBairro = {};
  ativos.forEach(e => { const b = est[e.id].bairroAtual; if (b) (porBairro[b] ||= []).push(e); });
  for (const [b, es] of Object.entries(porBairro)) {
    const frentes = [...new Set(es.map(e => e.frente))];
    if (es.length > 1 && frentes.length > 1)
      add(3, 'bairro', 'Frentes diferentes no mesmo bairro',
        b + ' — ' + es.map(e => e.nome).join(', ') + ' (viola SPEC §3.1: um local em UMA lista)',
        es[0].id);
    else if (es.length > 1)
      add(1, 'bairro', es.length + ' equipes no mesmo bairro',
        b + ' — ' + es.map(e => e.nome).join(', ') + ' (mesma frente, previsto)', es[0].id);
  }

  /* --- 3. duas equipes fazendo a mesma rua --- */
  const porRua = {};
  ativos.filter(e => e.frente === 'PAP').forEach(e => {
    const p = est[e.id].pontoAtual; if (p) (porRua[p.nome] ||= []).push(e); });
  for (const [r, es] of Object.entries(porRua))
    if (es.length > 1)
      add(3, 'rua', 'Mesma rua para ' + es.length + ' duplas',
        r + ' — ' + es.map(e => e.nome).join(', '), es[0].id);

  /* --- 4. equipes muito próximas (distância configurável) --- */
  for (let i = 0; i < ativos.length; i++)
    for (let j = i + 1; j < ativos.length; j++) {
      const a = ativos[i], b = ativos[j], sa = est[a.id], sb = est[b.id];
      const d = Math.round(hav(sa.lat, sa.lon, sb.lat, sb.lon));
      if (d < CFG.distMinEquipes && a.frente !== b.frente)
        add(2, 'proximidade', 'Equipes a ' + d + ' m uma da outra',
          a.nome + ' (' + FR[a.frente].nome + ') × ' + b.nome + ' (' + FR[b.frente].nome +
          ') — mínimo configurado ' + CFG.distMinEquipes + ' m', a.id);
    }

  /* --- 5. rua já realizada sendo replanejada (histórico) --- */
  let replan = 0;
  plano.equipes.filter(e => e.frente === 'PAP')
    .forEach(e => e.pontos.forEach(p => { if (RUAS_FEITAS.has(p.id)) replan++; }));
  if (replan)
    add(2, 'replan', replan + ' ruas já concluídas foram replanejadas',
      'o histórico registra baixa anterior para essas ruas', null);

  /* --- 6. ponto elegível do dia sem equipe --- */
  const usados = new Set(plano.equipes.flatMap(e => e.pontos.map(p => p.id)));
  const feirasSem = (plano.feirasDia || []).filter(f => f.elegivel && !usados.has(f.id));
  if (feirasSem.length)
    add(2, 'semrota', feirasSem.length + ' feiras elegíveis sem equipe',
      wdOf(plano.data) + ': ' + feirasSem.map(f => f.id).join(', ') +
      ' — capacidade da frente é ' + FR.FEI.cap + ' pontos/dia', null);
  if (!plano.quad && !plano.fora)
    add(3, 'semrota', 'Porta a porta sem quadrante para o dia',
      'o calendário do dado cobre 16/08 a 27/09; ' + fmtBR(plano.data) + ' está fora dele', null);

  /* --- 7. regra territorial: feira bloqueada no dia (SPEC §3.1 / achado A1) --- */
  if ((plano.feirasBloq || []).length)
    add(2, 'territorio', (plano.feirasBloq.length) + ' feiras do dia bloqueadas pela regra territorial',
      plano.feirasBloq.map(f => f.id).join(', ') +
      ' caem nos 11 bairros do porta a porta e a proposta nunca as sugere', null);

  /* --- 8. windbanner × ação no cruzamento (SPEC §3.4, raio 250 m) --- */
  const wcon = plano.equipes.filter(e => e.frente === 'WIN')
    .flatMap(e => e.pontos).filter(p => {
      const b = D.banners.find(x => x.id === p.id); return b && b.distSemaforo < CFG.raioWind; });
  if (wcon.length)
    add(3, 'territorio', wcon.length + ' pontos de windbanner do dia em conflito com ação no cruzamento',
      'a menos de ' + CFG.raioWind + ' m de cruzamento elegível — SPEC §3.4 manda remanejar', null);

  /* --- 9. janela legal (SPEC §3.5) --- */
  const win = plano.equipes.filter(e => e.frente === 'WIN');
  if (win.length && tmin < hm2min('06:00') && tmin > hm2min('04:00'))
    add(3, 'legal', 'Instalação de windbanner antes das 06:00',
      'SPEC §3.5: instalar ≥ 06:00, recolher ≤ 22:00', win[0].id);
  if (tmin > hm2min('22:00'))
    add(3, 'legal', 'Operação após 22:00', 'som e windbanner fora da janela legal', null);

  /* --- 10. divergência cadastro × geometria (auditoria da própria base) --- */
  const dv = D.semaforos.filter(s => s.divergeGeo).length + D.feiras.filter(f => f.divergeGeo).length;
  if (dv) add(1, 'dado', dv + ' pontos com bairro cadastrado ≠ bairro geográfico',
    'classificação territorial usa o nome cadastrado (critério do SPEC); a geometria discorda nesses casos', null);

  const ordem = { liberacao:0, rota:1, quadrante:2, gps:3, bairro:4, rua:5, territorio:6, legal:7 };
  return A.sort((a, b) => b.sev - a.sev || (ordem[a.tipo] ?? 9) - (ordem[b.tipo] ?? 9));
}

/* ---- KPIs do dashboard (prompt §6) ---- */
function kpis(plano, est) {
  const eq = plano.equipes, s = id => est[id] || {};
  const cnt = f => eq.filter(e => f(s(e.id))).length;
  const ativas = cnt(x => x.status && x.status !== 'AGUARDANDO');
  const ruasTot = eq.filter(e => e.frente === 'PAP').reduce((a, e) => a + e.pontos.length, 0);
  const ruasOk  = eq.filter(e => e.frente === 'PAP').reduce((a, e) => a + (s(e.id).feitos || 0), 0);
  const ptTot = eq.reduce((a, e) => a + e.pontos.length, 0);
  const ptOk  = eq.reduce((a, e) => a + (s(e.id).feitos || 0), 0);
  const rotasOk = cnt(x => x.status === 'CONCLUÍDA');
  return {
    ativas, emRota: cnt(x => x.status === 'EM ROTA'),
    foraRota: cnt(x => x.status === 'FORA DA ROTA' || x.status === 'FORA DO QUADRANTE'),
    atrasadas: cnt(x => x.status === 'ATRASADA'), paradas: cnt(x => x.status === 'PARADA'),
    gpsOff: cnt(x => x.status === 'GPS OFFLINE'),
    rotasOk, rotasPct: eq.length ? Math.round(100 * eq.reduce((a, e) => a + (s(e.id).fReal || 0), 0) / eq.length) : 0,
    ruasOk, ruasPend: ruasTot - ruasOk, ruasTot,
    ptOk, ptPend: ptTot - ptOk, ptTot, total: eq.length
  };
}

/* ==========================================================================
   MAPA VETORIAL — canvas, sem dependência externa.
   Geometria real: polígonos dos 11 bairros, retângulos dos 43 quadrantes,
   874 segmentos de rua, 53 feiras, 157 semáforos, 144 escolas, 300 pontos
   de windbanner.
   ========================================================================== */
const LAYERS = [
  { id:'equipes',  nome:'Equipes',            cor:'#22d3ee', on:true },
  { id:'rotas',    nome:'Rotas planejadas',   cor:'#67e8f9', on:true },
  { id:'trilha',   nome:'Trajeto realizado',  cor:'#f472b6', on:true },
  { id:'quad',     nome:'Quadrantes',         cor:'#a78bfa', on:true },
  { id:'bairros',  nome:'Bairros',            cor:'#2dd4bf', on:true },
  { id:'ruas',     nome:'Ruas porta a porta', cor:'#3b6b8f', on:true },
  { id:'semaforo', nome:'Semáforos',          cor:'#f59e0b', on:true },
  { id:'escola',   nome:'Escolas',            cor:'#22c55e', on:true },
  { id:'feira',    nome:'Feiras',             cor:'#fb923c', on:true },
  { id:'wind',     nome:'Windbanners',        cor:'#c084fc', on:true },
  { id:'feitos',   nome:'Pontos concluídos',  cor:'#4ade80', on:false },
  { id:'pend',     nome:'Pontos pendentes',   cor:'#94a3b8', on:false }
];
const LON = Object.fromEntries(LAYERS.map(l => [l.id, l.on]));

const MAP = { k:1, cx:-23.20, cy:-45.89, cv:null, ctx:null, w:0, h:0, hits:[], foco:null };

function projInit() {
  let la0 = 9e9, la1 = -9e9, lo0 = 9e9, lo1 = -9e9;
  D.bairros.forEach(b => { la0 = Math.min(la0, b.bbox[0]); la1 = Math.max(la1, b.bbox[1]);
    lo0 = Math.min(lo0, b.bbox[2]); lo1 = Math.max(lo1, b.bbox[3]); });
  D.semaforos.concat(D.feiras, D.banners).forEach(p => { if (p.lat == null) return;
    la0 = Math.min(la0, p.lat); la1 = Math.max(la1, p.lat);
    lo0 = Math.min(lo0, p.lon); lo1 = Math.max(lo1, p.lon); });
  MAP.bbox = [la0, la1, lo0, lo1];
  MAP.cy = (la0 + la1) / 2; MAP.cx = (lo0 + lo1) / 2;
}
function fit(pad = 0.9) {
  const [la0, la1, lo0, lo1] = MAP.bbox;
  const cosl = Math.cos(rad(MAP.cy));
  MAP.k = Math.min(MAP.w / ((lo1 - lo0) * cosl), MAP.h / (la1 - la0)) * pad;
  MAP.cy = (la0 + la1) / 2; MAP.cx = (lo0 + lo1) / 2;
}
const SX = lo => MAP.w / 2 + (lo - MAP.cx) * Math.cos(rad(MAP.cy)) * MAP.k;
const SY = la => MAP.h / 2 - (la - MAP.cy) * MAP.k;
const INVX = x => MAP.cx + (x - MAP.w / 2) / (Math.cos(rad(MAP.cy)) * MAP.k);
const INVY = y => MAP.cy - (y - MAP.h / 2) / MAP.k;

const STCOR = { 'EM ROTA':'#22c55e', 'ATRASADA':'#f59e0b', 'FORA DA ROTA':'#ef4444',
  'FORA DO QUADRANTE':'#ef4444', 'PARADA':'#f59e0b', 'GPS OFFLINE':'#ef4444',
  'CONCLUÍDA':'#22d3ee', 'AGUARDANDO':'#64748b', 'ENCERRADA INCOMPLETA':'#fb923c',
  'AGUARDANDO LIBERAÇÃO':'#64748b' };

function desenha(plano, est) {
  const c = MAP.ctx; if (!c) return;
  const dpr = window.devicePixelRatio || 1;
  MAP.w = MAP.cv.clientWidth; MAP.h = MAP.cv.clientHeight;
  if (MAP.cv.width !== MAP.w * dpr) { MAP.cv.width = MAP.w * dpr; MAP.cv.height = MAP.h * dpr; }
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  // o enquadramento inicial só é confiável depois que o canvas tem layout real
  if (MAP.precisaFit && MAP.w > 40 && MAP.h > 40) { MAP.precisaFit = false; fit(); }
  MAP.hits = [];

  // fundo
  const g = c.createLinearGradient(0, 0, 0, MAP.h);
  g.addColorStop(0, '#0b1520'); g.addColorStop(1, '#080f17');
  c.fillStyle = g; c.fillRect(0, 0, MAP.w, MAP.h);
  // grade
  c.strokeStyle = 'rgba(30,50,71,.42)'; c.lineWidth = 1;
  for (let x = 0; x < MAP.w; x += 46) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, MAP.h); c.stroke(); }
  for (let y = 0; y < MAP.h; y += 46) { c.beginPath(); c.moveTo(0, y); c.lineTo(MAP.w, y); c.stroke(); }

  const PAL = ['#22c55e','#22d3ee','#a78bfa','#fb923c','#f472b6','#facc15','#2dd4bf','#f87171','#818cf8','#34d399','#fb7185'];

  // ---- bairros ----
  if (LON.bairros) D.bairros.forEach((b, i) => {
    const col = PAL[i % PAL.length];
    b.rings.forEach(r => {
      c.beginPath();
      r.forEach((p, j) => { const x = SX(p[1]), y = SY(p[0]); j ? c.lineTo(x, y) : c.moveTo(x, y); });
      c.closePath();
      c.fillStyle = col + '14'; c.fill();
      c.strokeStyle = col + 'aa'; c.lineWidth = 1.4; c.stroke();
    });
    if (MAP.k > 900) {
      const cy = (b.bbox[0] + b.bbox[1]) / 2, cx = (b.bbox[2] + b.bbox[3]) / 2;
      c.fillStyle = col + 'dd'; c.font = '700 10px Segoe UI'; c.textAlign = 'center';
      c.fillText(b.nome, SX(cx), SY(cy));
    }
  });

  // ---- quadrantes ----
  if (LON.quad) D.quadrantes.forEach(q => {
    const x0 = SX(q.rect[2]), x1 = SX(q.rect[3]), y0 = SY(q.rect[1]), y1 = SY(q.rect[0]);
    const ativo = plano.quad && plano.quad.id === q.id;
    c.strokeStyle = ativo ? '#22d3ee' : 'rgba(167,139,250,.42)';
    c.lineWidth = ativo ? 2 : 1; c.setLineDash(ativo ? [] : [4, 4]);
    c.strokeRect(x0, y0, x1 - x0, y1 - y0); c.setLineDash([]);
    if (ativo) { c.fillStyle = 'rgba(34,211,238,.09)'; c.fillRect(x0, y0, x1 - x0, y1 - y0); }
    if (MAP.k > 2600 || ativo) {
      c.fillStyle = ativo ? '#22d3ee' : 'rgba(167,139,250,.8)';
      c.font = '700 9.5px Segoe UI'; c.textAlign = 'left';
      c.fillText(q.id, x0 + 4, y0 + 12);
    }
    MAP.hits.push({ x:(x0+x1)/2, y:(y0+y1)/2, r:0, box:[x0,y0,x1,y1], t:'quad', o:q });
  });

  // ---- ruas porta a porta ----
  if (LON.ruas && MAP.k > 1500) {
    c.strokeStyle = 'rgba(59,107,143,.55)'; c.lineWidth = 1.6;
    c.beginPath();
    D.ruas.forEach(r => { c.moveTo(SX(r.a[1]), SY(r.a[0])); c.lineTo(SX(r.b[1]), SY(r.b[0])); });
    c.stroke();
  }

  // ---- pontos operacionais ----
  const pt = (la, lo, cor, r, forma, o, t) => {
    if (la == null) return;
    const x = SX(lo), y = SY(la);
    if (x < -30 || x > MAP.w + 30 || y < -30 || y > MAP.h + 30) return;
    c.beginPath();
    if (forma === 'sq') c.rect(x - r, y - r, r * 2, r * 2);
    else if (forma === 'tri') { c.moveTo(x, y - r); c.lineTo(x + r, y + r); c.lineTo(x - r, y + r); c.closePath(); }
    else c.arc(x, y, r, 0, 7);
    c.fillStyle = cor; c.fill();
    c.strokeStyle = 'rgba(8,14,20,.85)'; c.lineWidth = 1; c.stroke();
    MAP.hits.push({ x, y, r:r + 4, t, o });
  };
  if (LON.escola)   D.escolas.forEach(e => pt(e.lat, e.lon, e.dentroPaP ? '#166534' : '#22c55e', 3.2, 'tri', e, 'escola'));
  if (LON.wind)     D.banners.forEach(b => pt(b.lat, b.lon, b.conflito ? '#7c3aed' : '#c084fc', 2.6, 'sq', b, 'wind'));
  if (LON.semaforo) D.semaforos.forEach(s => pt(s.lat, s.lon, s.elegivel ? '#f59e0b' : '#78350f', 3.4, 'ci', s, 'semaforo'));
  if (LON.feira)    D.feiras.forEach(f => pt(f.lat, f.lon, f.elegivel ? '#fb923c' : '#7c2d12', 4.2, 'sq', f, 'feira'));

  // ---- rotas planejadas + trajeto realizado ----
  plano.equipes.forEach(e => {
    const s = est[e.id]; if (!s) return;
    const cor = FR[e.frente].cor;
    const foco = MAP.foco === e.id;
    if (LON.rotas && e.pontos.length > 1) {
      c.beginPath();
      e.pontos.forEach((p, i) => { const x = SX(p.lon), y = SY(p.lat); i ? c.lineTo(x, y) : c.moveTo(x, y); });
      c.strokeStyle = foco ? cor : cor + '77'; c.lineWidth = foco ? 2.2 : 1.3;
      c.setLineDash([5, 4]); c.stroke(); c.setLineDash([]);
    }
    if (LON.feitos || LON.pend) e.pontos.forEach((p, i) => {
      const ok = i < s.feitos;
      if ((ok && LON.feitos) || (!ok && LON.pend))
        pt(p.lat, p.lon, ok ? '#4ade80' : '#94a3b8', 2.4, 'ci', p, 'ponto');
    });
    if (LON.trilha && s.trilha.length > 1) {
      c.beginPath();
      s.trilha.forEach((p, i) => { const x = SX(p[1]), y = SY(p[0]); i ? c.lineTo(x, y) : c.moveTo(x, y); });
      c.strokeStyle = foco ? '#f472b6' : 'rgba(244,114,182,.55)';
      c.lineWidth = foco ? 2.4 : 1.5; c.stroke();
    }
  });

  // ---- equipes ----
  if (LON.equipes) plano.equipes.forEach(e => {
    const s = est[e.id]; if (!s || s.status === 'AGUARDANDO') return;
    if (s.status === 'AGUARDANDO LIBERAÇÃO' && !ST.editMapa) return;
    const x = SX(s.lon), y = SY(s.lat), cor = STCOR[s.status] || '#22d3ee';
    const foco = MAP.foco === e.id;
    if (s.desvioM > CFG.tolDesvio) {          // liga posição real à planejada
      c.beginPath(); c.moveTo(x, y); c.lineTo(SX(s.planLon), SY(s.planLat));
      c.strokeStyle = 'rgba(239,68,68,.65)'; c.lineWidth = 1.2; c.setLineDash([3, 3]);
      c.stroke(); c.setLineDash([]);
    }
    c.beginPath(); c.arc(x, y, foco ? 16 : 12, 0, 7);
    c.fillStyle = cor + '2b'; c.fill();
    c.beginPath(); c.arc(x, y, foco ? 8 : 6.5, 0, 7);
    c.fillStyle = cor; c.fill();
    c.strokeStyle = '#08101a'; c.lineWidth = 2; c.stroke();
    const lbl = e.id;
    c.font = '700 10px Segoe UI'; c.textAlign = 'center';
    const w = c.measureText(lbl).width + 11;
    c.fillStyle = 'rgba(8,14,20,.9)';
    c.beginPath(); c.roundRect(x - w / 2, y - (foco ? 30 : 26), w, 15, 4); c.fill();
    c.strokeStyle = cor; c.lineWidth = 1; c.stroke();
    c.fillStyle = cor; c.fillText(lbl, x, y - (foco ? 19 : 15));
    MAP.hits.push({ x, y, r:15, t:'equipe', o:e, s });
  });

  // escala
  const mpp = 1 / (MAP.k / 111320);
  let alvo = 200, px = alvo / mpp;
  while (px < 45) { alvo *= 2; px = alvo / mpp; }
  while (px > 150) { alvo /= 2; px = alvo / mpp; }
  const el = document.getElementById('mscale');
  if (el) el.innerHTML = '<span class="ln" style="width:' + Math.round(px) + 'px"></span>' +
    (alvo >= 1000 ? (alvo / 1000) + ' km' : Math.round(alvo) + ' m');
}

function hitTest(x, y) {
  for (let i = MAP.hits.length - 1; i >= 0; i--) {
    const h = MAP.hits[i];
    if (h.r && (x - h.x) ** 2 + (y - h.y) ** 2 <= h.r ** 2) return h;
  }
  for (let i = MAP.hits.length - 1; i >= 0; i--) {
    const h = MAP.hits[i];
    if (h.box && x >= h.box[0] && x <= h.box[2] && y >= h.box[1] && y <= h.box[3]) return h;
  }
  return null;
}

  if (h.t === 'ponto') return '<b>' + o.nome + '</b><div class="l">' + o.id + ' · ordem ' + o.ordem + '</div>';
  return '';
}

function donut() {
  const k = ST.kpi, R = 52, C = 2 * Math.PI * R;
  const partes = [
    { n:'Pontos concluídos', v:k.ptOk,   c:'#22c55e' },
    { n:'Pontos pendentes',  v:k.ptPend, c:'#fb923c' }
  ];
  const tot = Math.max(1, k.ptTot); let off = 0;
  const arcs = partes.map(p => { const len = C * p.v / tot;
    const s = '<circle cx="66" cy="66" r="' + R + '" fill="none" stroke="' + p.c +
      '" stroke-width="15" stroke-dasharray="' + len + ' ' + (C - len) + '" stroke-dashoffset="' + (-off) +
      '" transform="rotate(-90 66 66)"/>'; off += len; return s; }).join('');
  const pct = Math.round(100 * k.ptOk / tot);
  return '<svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="' + R +
    '" fill="none" stroke="#16202c" stroke-width="15"/>' + arcs +
    '<text x="66" y="63" text-anchor="middle" fill="#dce8f5" font-size="21" font-weight="700">' + pct + '%</text>' +
    '<text x="66" y="79" text-anchor="middle" fill="#8aa4bf" font-size="9.5">Concluído</text></svg>' +
    '<div id="dlg">' + [
      ['#22c55e', 'Pontos atendidos', nb(k.ptOk)],
      ['#fb923c', 'Pontos pendentes', nb(k.ptPend)],
      ['#4ade80', 'Ruas concluídas',  nb(k.ruasOk)],
      ['#3b6b8f', 'Ruas pendentes',   nb(k.ruasPend)],
      ['#22d3ee', 'Rotas concluídas', k.rotasOk + ' / ' + k.total],
      ['#a78bfa', 'Avanço médio',     k.rotasPct + '%']
    ].map(r => '<div class="li"><span class="sw" style="background:' + r[0] + '"></span>' + r[1] +
      '<span class="vv mono">' + r[2] + '</span></div>').join('') + '</div>';
}

  const plan = new Set(ST.plano.equipes.filter(e => e.frente === 'PAP').flatMap(e => e.pontos.map(p => p.id)));
  const feitos = new Set();
  ST.plano.equipes.filter(e => e.frente === 'PAP').forEach(e => {

      '<td class="mono">' + r.m + ' m</td><td class="mono">' + fmtBR(qd.data) + '</td>' +
      '<td>' + (feitos.has(r.id) ? '<span class="tag t-gr">CONCLUÍDA (sim.)</span>'

    '</tbody></table></div>' +

}

/* ------------------------ PONTOS OPERACIONAIS ------------------------ */
function pgPontos() {
  const q = ST.busca.toLowerCase();
  const bloco = (titulo, cor, cols, linhas, nota) =>
    '<div class="card" style="margin-bottom:12px"><h3><span style="color:' + cor + '">' + titulo +
    '</span><span class="r">' + linhas.length + ' pontos</span></h3>' +

    '<div class="scroll" style="max-height:330px"><table><thead><tr>' + cols.map(c => '<th>' + c + '</th>').join('') +
    '</tr></thead><tbody>' + linhas.map(l => '<tr>' + l.map(v => '<td>' + v + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></div></div>';
  const mt = s => !q || String(s).toLowerCase().includes(q);

  const fe = D.feiras.filter(f => mt(f.nome + f.bairro + f.id)).map(f => [
    '<span class="mono">' + f.id + '</span>', esc(f.nome), WDL[f.dia], f.horario, esc(f.bairro),
    f.artesanato ? '<span class="tag t-gy">ARTESANATO — FORA DO ESCOPO</span>'
      : f.dentroPaP ? '<span class="tag t-rd">BLOQUEADA (11 bairros)</span>'
      : '<span class="tag t-gr">ELEGÍVEL</span>',
    f.divergeGeo ? '<span class="prov p-diverg">CADASTRO ≠ GEO</span>' : '']);
  const se = D.semaforos.filter(s => mt(s.cruzamento + s.bairroRef + s.id)).map(s => [
    '<span class="mono">' + s.id + '</span>', esc(s.cruzamento), s.regiao, esc(s.bairroRef),
    '<span class="mono">' + s.score + '</span>', '<span class="mono">' + nb(s.fluxo) + '</span>',
    s.elegivel ? '<span class="tag t-gr">CAMPO ABERTO</span>' : '<span class="tag t-rd">DENTRO DOS 11 BAIRROS</span>']);
  const ee = D.escolas.filter(e => mt(e.nome + e.bairro)).map(e => [
    '<span class="mono">' + e.id + '</span>', esc(e.nome), esc(e.bairro), e.rede,
    '<span class="mono">' + nb(e.demanda) + '</span>', '<span class="mono">' + e.rank + '</span>',
    e.portaoPais ? '<span class="tag t-gr">PORTÃO DE PAIS</span>' : '<span class="tag t-gy">NÃO ELEGÍVEL</span>']);
  const we = D.banners.filter(b => mt(b.via + b.regiao + b.id)).map(b => [
    '<span class="mono">' + b.id + '</span>', esc(b.via), b.regiao, esc(b.ref || '—'),
    '<span class="mono">' + b.score + '</span>', '<span class="mono">' + nb(b.distSemaforo) + ' m</span>',
    b.conflito ? '<span class="tag t-rd">CONFLITO C/ AÇÃO NO CRUZAMENTO</span>' : '<span class="tag t-gr">LIVRE</span>']);

  return '<div class="page"><h2>Pontos operacionais</h2>' +
    '<div class="sub">O catálogo territorial completo, com a regra de elegibilidade de cada frente ' +
    'aplicada na hora — não é rótulo copiado de planilha.</div>' +
    '<div class="filters"><div class="fld" style="min-width:320px"><label>BUSCAR</label>' +
    '<input id="qbusca" value="' + esc(ST.busca) + '" placeholder="nome, bairro, região ou identificador"></div></div>' +
    bloco('FEIRAS', '#fb923c',
      ['ID','FEIRA','DIA','HORÁRIO','BAIRRO','SITUAÇÃO','CONFERÊNCIA'], fe,
      '53 pontos = 43 feiras + 1 mega + 3 noturnas + 6 de artesanato. Artesanato não é coberto (SPEC §3.3) ⇒ 47 em escopo. ' +
      'Dos 47, os que caem nos 11 bairros do porta a porta são bloqueados pela regra territorial (SPEC §3.1).') +
    bloco('SEMÁFOROS', '#f59e0b',
      ['ID','CRUZAMENTO','REGIÃO','BAIRRO REF.','SCORE','FLUXO EST.','SITUAÇÃO'], se,
      'Base em produção no sistema interno: 157 cruzamentos, X001–X157. 41 caem nos 11 bairros e ficam fora; 116 são elegíveis.') +
    bloco('ESCOLAS', '#22c55e',
      ['ID','ESCOLA','BAIRRO','REDE','DEMANDA','RANKING','PORTÃO'], ee,
      'SPEC §3.2 — entra fundamental (anos iniciais) e educação infantil; ficam de fora rede estadual, ensino médio e ETEC. ' +
      'Picos de portão: 07:15 · 12:15 · 12:30 · 17:30.') +
    bloco('WINDBANNER', '#c084fc',
      ['ID','VIA','REGIÃO','REFERÊNCIA','SCORE','DIST. AÇÃO NO CRUZAMENTO','SITUAÇÃO'], we,
      'SPEC §3.4 — onde tem ação no cruzamento não tem windbanner (raio de ' + CFG.raioWind + ' m). ' +
      'Instalar ≥ 06:00, recolher ≤ 22:00; nunca em poste, árvore ou mobiliário urbano.') +
    '</div>';
}

/* ==========================================================================
   ADMINISTRAÇÃO — programação do dia, edição de equipe e de itinerário
   Toda ação passa por exigePapel(): esconder botão não é controle de acesso.
   ========================================================================== */
const amanhaDe = iso => { const d = iso2d(iso); d.setUTCDate(d.getUTCDate() + 1); return d2iso(d); };

/* ---------------------------- AÇÕES ---------------------------- */
function acConfirmar(iso) {
  if (!exigePapel('confirmar')) return;
  const d = diaEdit(iso), p = planoDoDia(iso);
  const semGente = p.equipes.filter(e => !(e.membros || []).length);
  d.estado = 'CONFIRMADO'; d.confirmadoEm = min2hm(ST.hora);
  registra(iso, 'DIA CONFIRMADO', 'versão ' + d.versao + ' · ' + p.equipes.length + ' equipes' +
    (semGente.length ? ' · ' + semGente.length + ' sem gente designada' : ''));
  salvaEdicoes(); ST.dirty = true;
  aviso('Programação de ' + fmtBR(iso) + ' confirmada. Falta liberar para a rua.', 'cy');
  render(true);
}
function acLiberar(iso) {
  if (!exigePapel('liberar')) return;
  const d = diaEdit(iso);
  if (d.estado !== 'CONFIRMADO') { aviso('Confirme a programação antes de liberar.', 'am'); return; }
  d.estado = 'LIBERADO'; d.liberadoEm = min2hm(ST.hora);
  registra(iso, 'LIBERADO PARA A RUA', 'versão ' + d.versao + ' às ' + d.liberadoEm);
  salvaEdicoes(); ST.dirty = true;
  aviso('Dia liberado. O campo já enxerga a programação de ' + fmtBR(iso) + '.', 'gr');
  render(true);
}
function acReabrir(iso) {
  if (!exigePapel('reabrir')) return;
  const d = diaEdit(iso);
  d.estado = 'AJUSTADO'; d.versao++; d.liberadoEm = null; d.confirmadoEm = null;
  registra(iso, 'DIA REABERTO', 'tirado do ar para ajuste — versão ' + d.versao);
  salvaEdicoes(); ST.dirty = true;
  aviso('Dia reaberto para ajuste. O campo parou de enxergar.', 'am');
  render(true);
}
function acSalvaEquipe(iso, id, campos) {
  if (!exigePapel('editarEquipe')) return;
  const d = diaEdit(iso);
  d.equipes[id] = Object.assign({}, d.equipes[id], campos);
  mutou(iso, 'EQUIPE EDITADA', id + ' · ' + Object.keys(campos).join(', '));
  render(true);
}
function acRemoveEquipe(iso, id) {
  if (!exigePapel('editarEquipe')) return;
  const d = diaEdit(iso);
  d.removidas = [...new Set([...(d.removidas || []), id])];
  delete d.itin[id];
  if (ST.sel === id) ST.sel = null;
  if (ST.edEquipe === id) ST.edEquipe = null;
  mutou(iso, 'EQUIPE RETIRADA DO DIA', id);
  render(true);
}
function acRestauraEquipe(iso, id) {
  if (!exigePapel('editarEquipe')) return;
  const d = diaEdit(iso);
  d.removidas = (d.removidas || []).filter(x => x !== id);
  mutou(iso, 'EQUIPE DEVOLVIDA AO DIA', id);
  render(true);
}
function acNovaEquipe(iso, frente) {
  if (!exigePapel('editarEquipe')) return;
  const d = diaEdit(iso), f = FR[frente];
  const usados = new Set(planoDoDia(iso).equipes.map(e => e.id));
  let n = 1, id;
  do { id = f.sigla + (n++); } while (usados.has(id));
  d.novas = [...(d.novas || []), { id, frente, nome:'Equipe ' + id, ini:f.ini, fim:f.fim, pessoas:2 }];
  d.itin[id] = [];
  mutou(iso, 'EQUIPE CRIADA', id + ' · ' + f.nome);
  ST.edEquipe = id; ST.edItin = id;
  render(true);
}
/* -- itinerário -- */
function itinAtual(iso, id) {
  const d = diaEdit(iso);
  if (d.itin[id]) return d.itin[id];
  const e = (ST.plano.data === iso ? ST.plano : planoDoDia(iso)).equipes.find(x => x.id === id);
  return e ? e.pontos.map(p => p.id) : [];
}
function acItin(iso, id, novo, oque) {
  if (!exigePapel('editarItinerario')) return;
  diaEdit(iso).itin[id] = novo;
  mutou(iso, 'ITINERÁRIO ALTERADO', id + ' · ' + oque + ' · ' + novo.length + ' paradas');
  render(true);
}
function acMovePonto(iso, id, i, dir) {
  const it = [...itinAtual(iso, id)], j = i + dir;
  if (j < 0 || j >= it.length) return;
  [it[i], it[j]] = [it[j], it[i]];
  acItin(iso, id, it, 'parada ' + (i + 1) + ' → ' + (j + 1));
}
function acRemovePonto(iso, id, pid) {
  acItin(iso, id, itinAtual(iso, id).filter(x => x !== pid), 'removeu ' + pid);
}
function acAddPonto(iso, id, pid) {
  const it = itinAtual(iso, id);
  if (it.includes(pid)) { aviso('Essa parada já está no itinerário.', 'am'); return; }
  acItin(iso, id, [...it, pid], 'incluiu ' + pid);
}
/* designar uma parada a uma dupla — tira de quem estiver com ela */
function acDesigna(iso, pid, destino) {
  if (!exigePapel('editarItinerario')) return;
  const d = diaEdit(iso), p = ST.plano;
  let origem = null;
  p.equipes.forEach(e => { if (e.pontos.some(x => x.id === pid)) origem = e.id; });
  if (origem === destino) { aviso('A parada já é dessa dupla.', 'am'); return; }
  if (origem) d.itin[origem] = itinAtual(iso, origem).filter(x => x !== pid);
  if (destino) d.itin[destino] = [...itinAtual(iso, destino), pid];
  mutou(iso, 'PARADA DESIGNADA', pid + ': ' + (origem || 'sem dupla') + ' → ' + (destino || 'sem dupla'));
  render(true);
}
/* -- atividades -- */
function acAtividade(iso, op, dados) {
  if (!exigePapel('editarAtividade')) return;
  const A = atividadesDe(iso);
  if (op === 'add') {
    A.push(Object.assign({ id:'A' + (Date.parse(iso) % 1000) + '-' + (A.length + 1),
      frente:'PAP', ini:'09:00', fim:'12:00', titulo:'Nova atividade', tipo:'campo',
      status:'PREVISTA', obs:'' }, dados));
    mutou(iso, 'ATIVIDADE INCLUÍDA', (dados && dados.titulo) || 'nova');
  } else if (op === 'del') {
    const i = A.findIndex(a => a.id === dados.id);
    if (i >= 0) { const t = A[i].titulo; A.splice(i, 1); mutou(iso, 'ATIVIDADE REMOVIDA', t); }
  } else if (op === 'set') {
    const a = A.find(x => x.id === dados.id);
    if (a) { Object.assign(a, dados.campos); mutou(iso, 'ATIVIDADE ALTERADA', a.titulo); }
  }
  render(true);
}

/* ------------------------ BARRA DE ESTADO DO DIA ------------------------ */
function barraDia(iso, compacta) {
  const d = diaEdit(iso), est = d.estado, adm = pode(ST.papel, 'confirmar');
  const passos = CICLO.map(c => {
    const feito = CICLO.indexOf(c) <= CICLO.indexOf(est);
    return '<span class="passo ' + (feito ? 'on' : '') + (c === est ? ' cur' : '') + '">' + c + '</span>';
  }).join('<span class="seta">›</span>');
  const bts =
    (est === 'LIBERADO'
      ? '<button class="btn" data-ac="reabrir" data-iso="' + iso + '">Reabrir para ajuste</button>'
      : est === 'CONFIRMADO'
        ? '<button class="btn pri" data-ac="liberar" data-iso="' + iso + '">Liberar para a rua</button>' +
          '<button class="btn" data-ac="reabrir" data-iso="' + iso + '">Reabrir</button>'
        : '<button class="btn pri" data-ac="confirmar" data-iso="' + iso + '">Confirmar programação</button>');
  const nEq = ((ST.plano && ST.plano.data === iso) ? ST.plano : planoDoDia(iso)).equipes.length;
  const impr = '<button class="btn' + (est === 'LIBERADO' ? ' pri' : '') + '" data-ac="print" ' +
    'data-iso="' + iso + '">Imprimir folhas do dia (' + nEq + ')</button>';
  return '<div class="diabar ' + (compacta ? 'cp' : '') + '">' +
    '<span class="tag ' + CICLO_TAG[est] + '">' + est + '</span>' +
    '<span class="tiny muted mono">v' + d.versao + '</span>' +
    (compacta ? '' : '<span class="fluxo">' + passos + '</span>') +
    '<span class="tiny muted">' +
      (d.confirmadoEm ? 'confirmado ' + d.confirmadoEm + ' · ' : '') +
      (d.liberadoEm ? 'liberado ' + d.liberadoEm : est === 'LIBERADO' ? '' : 'campo NÃO enxerga') +
    '</span><span class="grow"></span>' + impr +
    (adm ? bts : '<span class="tiny muted">somente ADMIN altera</span>') +
    '</div>';
}

        outras.map(o => '<option value="' + o.id + '">' + esc(o.nome) + '</option>').join('') + '</select>' +
      '<button class="btn tiny" style="border-color:#ef444455;color:#f87171" data-ac="rmpt" data-id="' +
        id + '" data-pid="' + p.id + '">×</button></div>').join('')
      : '<div class="empty tiny">Itinerário vazio.</div>') + '</div>' +
    '<button class="btn pri" style="width:100%;margin-top:9px" data-ac="print" data-ids="' + id +
      '">Imprimir a folha de rua desta dupla</button>' +
    '<div class="fld" style="margin-top:11px"><label>INCLUIR PARADA (rua, feira, semáforo ou windbanner)</label>' +
      '<input id="qponto" value="' + esc(ST.buscaPonto || '') + '" placeholder="digite nome ou código: Q07-R003, F29, X001, P012…"></div>' +
    (cand.length ? '<div class="scroll" style="max-height:180px;border:1px solid var(--line);border-radius:8px">' +
      cand.map(p => '<div class="itrow"><span class="grow"><span class="small">' + esc(p.nome) + '</span>' +
        '<span class="tiny muted mono"> ' + p.id + ' · ' + p.tipo +
        (p.elegivel === false ? ' · <span class="sev-3">não elegível</span>' : '') + '</span></span>' +
        '<button class="btn tiny" data-ac="addpt" data-id="' + id + '" data-pid="' + p.id + '">Incluir</button>' +
        '</div>').join('') + '</div>'
      : (q.length >= 2 ? '<div class="empty tiny">Nada encontrado.</div>' : '')) +
    '</div></div></div>';
}

/* ==========================================================================
   FOLHA DE RUA — impressão do itinerário por equipe
   Feita para quem vai à rua SEM internet: papel A4, preto no branco, com
   espaço para a baixa manual de cada parada e para a assinatura. Os motivos
   de pendência impressos são a lista fechada do SPEC §4; o kit e os avisos
   legais saem do SPEC §2.4 e §3.5.
   ========================================================================== */
const KIT = {
  PAP:'500 folhetos · 40 formulários · 2 água · 2 caneta · 2 capa de chuva · 2 colete · 2 crachá · 1 prancheta',
  FEI:'800 folhetos · 2 placa de mão · 2 água · 2 caneta · 2 capa de chuva · 2 colete · 2 crachá · 1 prancheta',
  SEM:'300 folhetos · 2 placa de mão · 2 colete refletivo · 2 água · 2 capa de chuva · 2 colete · 2 crachá',
  WIN:'20 windbanners · 20 base+peso · 3 água · 3 colete · 3 colete refletivo · 3 crachá',
  LOG:'—'
};
const AVISO_LEGAL = {
  PAP:['Som só entre 08:00 e 22:00, e nunca a menos de 200 m de escola em funcionamento.'],
  FEI:['Feira de artesanato NÃO é coberta pela operação.','Respeitar o espaço dos feirantes e a circulação.'],
  SEM:['Colete refletivo é obrigatório no cruzamento.',
       'Som só entre 08:00 e 22:00, e nunca a menos de 200 m de escola em funcionamento.',
       'O bloco das 17:00–18:30 termina no escuro — o pôr do sol na janela é entre 17:49 e 18:03.'],
  WIN:['Instalar a partir das 06:00 e recolher até as 22:00.',
       'Nunca em poste, árvore ou mobiliário urbano.',
       'Não instalar em rotatória nem em canteiro central.',
       'Windbanner não dorme no local: monta de manhã, recolhe à tarde.'],
  LOG:['—']
};
const MOTIVOS = ['chuva','evento externo','falta de equipe','falta de material','tempo insuficiente','outro'];

function folhaEquipe(iso, e) {
  const f = FR[e.frente], d = diaEdit(iso), q = e.quad ? QMAP[e.quad] : null;
  const membros = e.membros || [];
  const linha = (p, i) => '<tr>' +
    '<td class="n">' + (i + 1) + '</td>' +
    '<td class="pt"><b>' + esc(p.nome) + '</b><span class="cod">' + p.id +
      (p.m ? ' · ' + p.m + ' m' : '') + (p.horario ? ' · ' + p.horario : '') + '</span></td>' +
    '<td class="bx"></td><td class="bx"></td><td class="bx"></td>' +
    '<td class="mo"></td></tr>';
  return '<section class="folha">' +
    (d.estado !== 'LIBERADO'
      ? '<div class="carimbo">RASCUNHO — DIA EM ' + d.estado + ', NÃO LIBERADO PARA A RUA</div>' : '') +
    '<header>' +
      '<div class="hl"><h1>FOLHA DE RUA</h1>' +
        '<div class="hd">' + fmtBR(iso) + ' · ' + WDL[wdOf(iso)] + '</div></div>' +
      '<div class="hr"><div class="frente">' + f.nome + '</div>' +
        '<div class="hd">' + e.nome + ' · versão ' + d.versao + '</div></div>' +
    '</header>' +
    '<table class="cab"><tbody>' +
      '<tr><th>Responsável da frente</th><td>' + f.resp + '</td>' +
          '<th>Horário</th><td>' + e.ini + ' às ' + e.fim + '</td></tr>' +
      '<tr><th>Quadrante</th><td>' + (q ? q.id + ' · setor ' + q.letra + ' · rumo ' + q.rumo : '—') + '</td>' +
          '<th>Bairro</th><td>' + esc(e.bairro) + '</td></tr>' +
      '<tr><th>Dupla</th><td colspan="3">' +
        (membros.length ? '<b>' + membros.map(esc).join(' &nbsp;·&nbsp; ') + '</b>'
                        : '<span class="preencher">nome 1: ________________________  nome 2: ________________________</span>') +
        '</td></tr>' +
      '<tr><th>Ponto de encontro</th><td colspan="3"><span class="preencher">' +
        '_________________________________________________  hora: _________</span></td></tr>' +
    '</tbody></table>' +
    (e.obs ? '<div class="recado"><b>Recado da coordenação:</b> ' + esc(e.obs) + '</div>' : '') +
    '<table class="paradas"><thead><tr>' +
      '<th class="n">#</th><th class="pt">PARADA</th>' +
      '<th class="bx">FEITA</th><th class="bx">PARCIAL</th><th class="bx">NÃO FEITA</th>' +
      '<th class="mo">MOTIVO (se não feita)</th></tr></thead><tbody>' +
    (e.pontos.length ? e.pontos.map(linha).join('')
      : '<tr><td colspan="6" class="vazio">Sem parada designada para esta equipe.</td></tr>') +
    '</tbody></table>' +
    '<div class="rodape">' +
      '<div class="bloco"><b>Motivos aceitos</b><span>' + MOTIVOS.join(' · ') + '</span></div>' +
      '<div class="bloco"><b>Kit da dupla</b><span>' + KIT[e.frente] + '</span></div>' +
      '<div class="bloco"><b>Atenção</b><ul>' +
        AVISO_LEGAL[e.frente].map(a => '<li>' + a + '</li>').join('') + '</ul>' +
        '<span class="mini">Na dúvida sobre um ponto, confirmar com a coordenação antes de agir.</span>' +
      '</div>' +
      '<div class="assin"><span>Assinatura da dupla</span><span>Conferido por</span></div>' +
      '<div class="fim">' + e.pontos.length + ' paradas · sem baixa explícita o fechamento marca NÃO FEITA e a parada volta para a fila · ' +
        'impresso em ' + fmtBR(iso) + ' ' + min2hm(ST.hora) + ' · Torre de Controle</div>' +
