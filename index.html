let FOLHAS_ABERTAS = null;

/* Monta as folhas em #print. Não imprime — só prepara. */
function montaFolhas(iso, ids) {
  const plano = (ST.plano && ST.plano.data === iso) ? ST.plano : planoDoDia(iso);
  const eqs = plano.equipes.filter(e => !ids || ids.includes(e.id));
  if (!eqs.length) { aviso('Nenhuma equipe para imprimir.', 'am'); return null; }
  document.getElementById('print').innerHTML = eqs.map(e => folhaEquipe(iso, e)).join('');
  FOLHAS_ABERTAS = { iso, ids };
  return eqs;
}
function limpaFolhas() {
  document.body.classList.remove('imprimindo', 'folhaview');
  document.getElementById('print').innerHTML = '';
  FOLHAS_ABERTAS = null;
  if (RELOGIO_ANTES !== null) { CFG.simRodando = RELOGIO_ANTES; RELOGIO_ANTES = null; }
}
let RELOGIO_ANTES = null;

/* Mostra as folhas na tela. É o caminho quando a impressão está bloqueada —
   o painel publicado roda dentro de um iframe protegido, onde window.print()
   não abre nada e também não dá erro. */
function modoFolha(msg) {
  document.body.classList.remove('imprimindo');
  document.body.classList.add('folhaview');
  document.getElementById('folhamsg').innerHTML = msg;
  window.scrollTo(0, 0);
}

function imprimir(iso, ids) {
  const eqs = montaFolhas(iso, ids);
  if (!eqs) return;
  registra(iso, 'FOLHAS GERADAS', eqs.length + ' folha(s): ' + eqs.map(e => e.id).join(', '));
  salvaEdicoes();
  if (estadoDia(iso) !== 'LIBERADO')
    aviso('O dia não está liberado — as folhas saem carimbadas como RASCUNHO.', 'am');
  tentarImprimir();
}

/* Chama a impressão de verdade. Se o navegador bloquear (iframe protegido),
   cai no modo folha em vez de falhar em silêncio. */
function tentarImprimir() {
  if (!document.getElementById('print').innerHTML) {
    if (!FOLHAS_ABERTAS) return;
    montaFolhas(FOLHAS_ABERTAS.iso, FOLHAS_ABERTAS.ids);
  }
  if (RELOGIO_ANTES === null) { RELOGIO_ANTES = CFG.simRodando; CFG.simRodando = false; }
  const eraFolhaView = document.body.classList.contains('folhaview');
  document.body.classList.add('imprimindo');

  /* A limpeza acontece SÓ no afterprint. Nada de timer cego: o Chrome roda um
     laço de eventos aninhado enquanto a pré-visualização está aberta, e um
     setTimeout dispararia no meio, apagando as folhas e imprimindo em branco. */
  let abriu = false;
  const marcaAbriu = () => { abriu = true; };
  const aoTerminar = () => {
    window.removeEventListener('afterprint', aoTerminar);
    window.removeEventListener('beforeprint', marcaAbriu);
    if (eraFolhaView) { document.body.classList.remove('imprimindo'); }
    else limpaFolhas();
  };
  window.addEventListener('beforeprint', marcaAbriu);
  window.addEventListener('afterprint', aoTerminar);

  try { window.print(); } catch (_) {}

  if (!abriu) {
    /* Não abriu nada e não deu erro: impressão bloqueada pelo navegador. */
    window.removeEventListener('afterprint', aoTerminar);
    window.removeEventListener('beforeprint', marcaAbriu);
    modoFolha('<b>Este navegador bloqueou a impressão.</b> ' +
      'Acontece no painel publicado, que roda numa moldura protegida. ' +
      'As folhas estão prontas abaixo — para mandar para a impressora, abra o arquivo ' +
      '<b>TORRE-DE-CONTROLE.html</b> no computador e clique no mesmo botão.');
    aviso('Impressão bloqueada pelo navegador — as folhas abriram na tela.', 'am');
  }
}

/* ==========================================================================
   MAPA DE ROTAS — pele clara, leitura de rua (padrão Google Maps)
   Por que existe, se já há o mapa do Dashboard: aquele é a cidade inteira,
   todas as frentes ao mesmo tempo, pele escura de torre de controle. Este é
   UMA rota por vez, rua a rua, enxuto — o que o controlador manda para quem
   vai caminhar ou dirigir.

   LIMITE HONESTO: as telas (tiles) e as fotos do Google NÃO carregam dentro
   de um artefato — a regra de conteúdo bloqueia toda imagem externa. O
   desenho aqui é local, com a MESMA geometria oficial do acervo (874
   segmentos de rua, 11 bairros, 43 quadrantes), na pele do Google Maps; e
   todo botão com seta abre o Google Maps de verdade numa guia ao lado, já na
   coordenada da parada. Só ponto operacional entra aqui — rua, feira,
   cruzamento, windbanner. Nenhum endereço de pessoa.
   ========================================================================== */
const GM = { k:0, lat:-23.20, lon:-45.89, w:0, h:0, cv:null, ctx:null, hits:[], fit:true, rota:null };
const GC = {
  chao:'#f2f0ea', bairro:'#f8f7f3', bairroL:'#e5e2d9',
  ruaF:'#ffffff', ruaC:'#dcd9d2', avF:'#fdf3d2', avC:'#e8d6a0',
  rota:'#1a73e8', rotaC:'#ffffff', txt:'#3c4043', halo:'#ffffff',
  pin:'#ea4335', ok:'#188038', agora:'#1a73e8', poi:'#7b8794'
};
const GAV = /^(avenida|av\.|rodovia|via |estrada|marginal|anel)/i;
const gmDist = m => m == null ? '—' : (m < 1000 ? Math.round(m) + ' m'
  : (m / 1000).toFixed(2).replace('.', ',') + ' km');

function gmEquipes() { return ST.plano.equipes.filter(e => e.pontos && e.pontos.length); }
function gmRotaAtual() {
  const eqs = gmEquipes(); if (!eqs.length) return null;
  let e = eqs.find(x => x.id === ST.gmRota);
  if (!e) { e = eqs.find(x => x.pontos.length > 1) || eqs[0]; ST.gmRota = e.id; }
  return e;
}
/* Paradas com a distância entre elas — o mapa da torre não responde isso, e é
   a primeira pergunta de quem vai à rua: quanto tem daqui até a próxima. */
function gmParadas(e) {
  let ac = 0;
  return e.pontos.map((p, i) => {
    const pv = i ? e.pontos[i - 1] : null;
    const d = pv ? Math.round(hav(pv.lat, pv.lon, p.lat, p.lon)) : 0;
    ac += d;
    return Object.assign({}, p, { n:i + 1, dPrev:d, dAc:ac });
  });
}

/* ---- links para o Google Maps de verdade (abrem em guia ao lado) ---- */
const gmQ = p => p.lat.toFixed(6) + ',' + p.lon.toFixed(6);
const gmLinkPonto = p => 'https://www.google.com/maps/search/?api=1&query=' + gmQ(p);
const gmLinkPano  = p => 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + gmQ(p);
const gmLinkDir = (a, b) => 'https://www.google.com/maps/dir/?api=1&travelmode=walking' +
  '&origin=' + gmQ(a) + '&destination=' + gmQ(b);
/* O Google aceita ~10 pontos por rota (origem + 8 paradas + destino). Rota
   mais longa sai em trechos encadeados — o fim de um é o começo do outro,
   sem furo entre eles. */
function gmLinksRota(P) {
  if (P.length < 2) return [{ r:'ver o ponto', url:gmLinkPonto(P[0]) }];
  const out = [];
  for (let i = 0; i < P.length - 1; i += 9) {
    const ch = P.slice(i, i + 10); if (ch.length < 2) break;
    const wp = ch.slice(1, -1).map(gmQ).join('|');
    out.push({ r:'paradas ' + ch[0].n + '–' + ch[ch.length - 1].n,
      url:'https://www.google.com/maps/dir/?api=1&travelmode=walking&origin=' + gmQ(ch[0]) +
          '&destination=' + gmQ(ch[ch.length - 1]) + (wp ? '&waypoints=' + encodeURIComponent(wp) : '') });
  }
  return out;
}

/* ---- enquadramento ---- */
function gmFit(pad) {
  const e = gmRotaAtual(); if (!e || !GM.w) return;
  pad = pad || 0.84;
  let la0 = 9e9, la1 = -9e9, lo0 = 9e9, lo1 = -9e9;
  const acc = (la, lo) => { la0 = Math.min(la0, la); la1 = Math.max(la1, la);
    lo0 = Math.min(lo0, lo); lo1 = Math.max(lo1, lo); };
  e.pontos.forEach(p => { acc(p.lat, p.lon); if (p.a) acc(p.a[0], p.a[1]); if (p.b) acc(p.b[0], p.b[1]); });
  GM.lat = (la0 + la1) / 2; GM.lon = (lo0 + lo1) / 2;
  const dla = la1 - la0, dlo = lo1 - lo0, cosl = Math.cos(rad(GM.lat));
  if (dla < 1e-5 && dlo < 1e-5) { GM.k = 70000; return; }   /* rota de ponto único */
  const kx = dlo > 1e-9 ? GM.w / (dlo * cosl) : 9e9;
  const ky = dla > 1e-9 ? GM.h / dla : 9e9;
  GM.k = Math.max(3000, Math.min(600000, Math.min(kx, ky) * pad));
}

/* ==========================================================================
   PINTURA — uma função só, usada pelo mapa grande e pela miniatura da parada
   ========================================================================== */
function gmPinta(c, v, o) {
  const cosl = Math.cos(rad(v.lat));
  const X = lo => v.w / 2 + (lo - v.lon) * cosl * v.k;
  const Y = la => v.h / 2 - (la - v.lat) * v.k;
  const mpp = 111320 / v.k;                       /* metros por pixel */
  const hits = o.hits; if (hits) hits.length = 0;
  c.clearRect(0, 0, v.w, v.h);
  c.fillStyle = GC.chao; c.fillRect(0, 0, v.w, v.h);
  c.lineCap = 'round'; c.lineJoin = 'round';

  /* --- 1. massas de bairro: dão o chão do mapa --- */
  c.fillStyle = GC.bairro; c.strokeStyle = GC.bairroL; c.lineWidth = 1;
  D.bairros.forEach(b => b.rings.forEach(r => {
    c.beginPath();
    r.forEach((p, i) => i ? c.lineTo(X(p[1]), Y(p[0])) : c.moveTo(X(p[1]), Y(p[0])));
    c.closePath(); c.fill(); c.stroke();
  }));

  /* --- 2. malha de ruas visível: a granularidade que o mapa da torre não dá --- */
  const la0 = v.lat - (v.h / 2) / v.k - 0.004, la1 = v.lat + (v.h / 2) / v.k + 0.004;
  const dlo = (v.w / 2) / (cosl * v.k) + 0.004, lo0 = v.lon - dlo, lo1 = v.lon + dlo;
  const vis = [];
  for (const r of D.ruas) {
    if (r.lat < la0 || r.lat > la1 || r.lon < lo0 || r.lon > lo1) continue;
    if (r.a && r.b) vis.push(r);
  }
  const wR = Math.max(1.2, Math.min(10, 26 / mpp)), wA = wR * 1.55;
  const traca = (lst, w) => { c.lineWidth = w; c.beginPath();
    lst.forEach(r => { c.moveTo(X(r.a[1]), Y(r.a[0])); c.lineTo(X(r.b[1]), Y(r.b[0])); }); c.stroke(); };
  const avs = vis.filter(r => GAV.test(r.nome)), rus = vis.filter(r => !GAV.test(r.nome));
  c.strokeStyle = GC.ruaC; traca(rus, wR + 2);
  c.strokeStyle = GC.ruaF; traca(rus, wR);
  c.strokeStyle = GC.avC;  traca(avs, wA + 2);
  c.strokeStyle = GC.avF;  traca(avs, wA);
  /* O acervo só tem malha de rua dentro dos 43 quadrantes de porta a porta.
     Fora deles o mapa fica vazio — dizer isso vale mais que fingir cobertura. */
  if (!vis.length && !o.mini) {
    c.fillStyle = '#9aa0a6'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = '600 12px "Segoe UI",system-ui,sans-serif';
    c.fillText('o acervo não tem malha de rua neste trecho — abra no Google Maps para ver as ruas',
      v.w / 2, v.h - 34);
  }

  /* --- 3. pontos operacionais que não são desta rota (contexto) --- */
  if (o.poi && mpp < 9) {
    const naRota = new Set((o.rota || []).map(p => p.id));
    c.fillStyle = GC.poi;
    [].concat(D.feiras, D.semaforos, D.banners).forEach(p => {
      if (p.lat == null || naRota.has(p.id)) return;
      if (p.lat < la0 || p.lat > la1 || p.lon < lo0 || p.lon > lo1) return;
      c.beginPath(); c.arc(X(p.lon), Y(p.lat), 2.6, 0, 6.29); c.fill();
    });
  }

  /* --- 4. a rota --- */
  const P = o.rota || [];
  const wRt = Math.max(3.4, Math.min(9, 22 / mpp));
  const tracaRota = () => { c.beginPath();
    P.forEach((p, i) => i ? c.lineTo(X(p.lon), Y(p.lat)) : c.moveTo(X(p.lon), Y(p.lat))); c.stroke(); };
  if (P.length > 1) {
    c.strokeStyle = GC.rotaC; c.lineWidth = wRt + 4.5; tracaRota();
    c.strokeStyle = GC.rota;  c.lineWidth = wRt;       tracaRota();
    /* setas de sentido: a rota tem ordem, e a ordem é a operação */
    c.fillStyle = GC.rota;
    for (let i = 1; i < P.length; i++) {
      const x0 = X(P[i-1].lon), y0 = Y(P[i-1].lat), x1 = X(P[i].lon), y1 = Y(P[i].lat);
      if (Math.hypot(x1 - x0, y1 - y0) < 46) continue;
      const an = Math.atan2(y1 - y0, x1 - x0), s = wRt * 0.95;
      c.save(); c.translate((x0 + x1) / 2, (y0 + y1) / 2); c.rotate(an);
      c.beginPath(); c.moveTo(s, 0); c.lineTo(-s * .8, s * .7); c.lineTo(-s * .8, -s * .7);
      c.closePath(); c.fill(); c.restore();
    }
  }
  /* o trecho de rua de cada parada de porta a porta é a operação em si */
  c.strokeStyle = '#0b57d0'; c.lineWidth = wRt * 0.6; c.globalAlpha = .75;
  P.forEach(p => { if (!p.a || !p.b) return;
    c.beginPath(); c.moveTo(X(p.a[1]), Y(p.a[0])); c.lineTo(X(p.b[1]), Y(p.b[0])); c.stroke(); });
  c.globalAlpha = 1;

  /* --- 5. marcadores numerados --- */
  const rM = o.mini ? 8 : 11;
  P.forEach((p, i) => {
    const x = X(p.lon), y = Y(p.lat);
    if (x < -40 || x > v.w + 40 || y < -60 || y > v.h + 40) return;
    const sel = o.sel === p.id;
    const cor = i < (o.feitos || 0) ? GC.ok : (i === (o.feitos || 0) && o.emRota ? GC.agora : GC.pin);
    const r = sel ? rM * 1.22 : rM, cy = y - r * 1.72;
    c.save();
    c.shadowColor = 'rgba(60,64,67,.45)'; c.shadowBlur = 4; c.shadowOffsetY = 1;
    c.fillStyle = cor; c.beginPath(); c.arc(x, cy, r, 0, 6.29);
    c.moveTo(x - r * .6, cy + r * .8); c.lineTo(x, y); c.lineTo(x + r * .6, cy + r * .8);
    c.closePath(); c.fill(); c.restore();
    if (sel) {
      c.strokeStyle = '#fff'; c.lineWidth = 2.4; c.beginPath(); c.arc(x, cy, r, 0, 6.29); c.stroke();
      c.strokeStyle = GC.rota; c.lineWidth = 2; c.beginPath(); c.arc(x, cy, r + 3.4, 0, 6.29); c.stroke();
    }
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = '700 ' + Math.round(r * .95) + 'px "Segoe UI",system-ui,sans-serif';
    c.fillText(String(p.n), x, cy + .5);
    if (hits) hits.push({ x:x, y:cy, r:r + 6, p:p });
  });

  /* --- 6. rótulos: só quando cabem, como num mapa de rua --- */
  if (o.rot !== false) {
    c.textAlign = 'center'; c.textBaseline = 'bottom';
    c.font = '600 ' + (o.mini ? 10 : 11.5) + 'px "Segoe UI",system-ui,sans-serif';
    c.lineWidth = 3.2; c.strokeStyle = GC.halo; c.fillStyle = GC.txt;
    P.forEach((p, i) => {
      if (!(mpp < 1.7 || o.sel === p.id || i === 0 || i === P.length - 1)) return;
      const x = X(p.lon), y = Y(p.lat) - (o.mini ? 8 : 11) * 2.9;
      if (x < 0 || x > v.w || y < 10 || y > v.h) return;
      const t = p.nome.length > 30 ? p.nome.slice(0, 29) + '…' : p.nome;
      c.strokeText(t, x, y); c.fillText(t, x, y);
    });
  }
}

function gmEscala() {
  const el = document.getElementById('gmesc'); if (!el) return;
  const mpp = 111320 / GM.k, alvo = mpp * 96;
  const p = [10,20,50,100,200,500,1000,2000,5000].find(x => x >= alvo) || 5000;
  el.innerHTML = '<span class="ln" style="width:' + Math.round(p / mpp) + 'px"></span>' +
    (p >= 1000 ? (p / 1000) + ' km' : p + ' m');
}

function gmDesenha() {
  const c = GM.ctx, e = gmRotaAtual(); if (!c || !e) return;
  const dpr = window.devicePixelRatio || 1;
  GM.cv.width = Math.round(GM.w * dpr); GM.cv.height = Math.round(GM.h * dpr);
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const s = ST.est[e.id] || {};
  gmPinta(c, { lat:GM.lat, lon:GM.lon, k:GM.k, w:GM.w, h:GM.h },
    { rota:gmParadas(e), feitos:s.feitos || 0, emRota:!!s.status && s.status !== 'AGUARDANDO',
      sel:ST.gmPonto, hits:GM.hits, poi:ST.gmPOI, rot:ST.gmRot });
  gmEscala();
}
/* miniatura da parada: é a imagem possível dentro do artefato — o mesmo
   desenho, no nível da rua, centrado no ponto escolhido. */
function gmMini() {
  const cv = document.getElementById('gmmini'); if (!cv) return;
  const e = gmRotaAtual(); if (!e) return;
  const P = gmParadas(e), p = P.find(x => x.id === ST.gmPonto); if (!p) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  let k = 90000;
  if (p.a && p.b) {                                  /* enquadra o trecho de rua inteiro */
    const dla = Math.abs(p.a[0] - p.b[0]), dlo = Math.abs(p.a[1] - p.b[1]);
    const cl = Math.cos(rad(p.lat));
    k = Math.min(dlo > 1e-9 ? w / (dlo * cl) : 9e9, dla > 1e-9 ? h / dla : 9e9) * 0.62;
    k = Math.max(60000, Math.min(320000, k));
  }
  gmPinta(c, { lat:p.lat, lon:p.lon, k:k, w:w, h:h },
    { rota:P, feitos:0, sel:p.id, hits:null, poi:true, rot:true, mini:true });
  /* anel de referência: dá escala à miniatura mesmo onde não há malha de rua */
  const raio = (p.a && p.b) ? 50 : 150, px = raio / (111320 / k);
  c.strokeStyle = 'rgba(26,115,232,.45)'; c.setLineDash([4, 4]); c.lineWidth = 1.2;
  c.beginPath(); c.arc(w / 2, h / 2, px, 0, 6.29); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#5f6368'; c.textAlign = 'left'; c.textBaseline = 'bottom';
  c.font = '600 9.5px "Segoe UI",system-ui,sans-serif';
  c.fillText('raio de ' + raio + ' m', 6, h - 5);
}

/* ---- montagem e interação do canvas ---- */
function montaGMapa() {
  const cv = document.getElementById('gmcv'); if (!cv) return;
  GM.cv = cv; GM.ctx = cv.getContext('2d');
  GM.w = cv.clientWidth; GM.h = cv.clientHeight;
  if (GM.fit || GM.rota !== ST.gmRota) { GM.rota = ST.gmRota; gmFit(); GM.fit = false; }
  gmDesenha(); gmMini();
  if (cv.dataset.lig) return; cv.dataset.lig = '1';

  let arr = false, lx = 0, ly = 0, moveu = 0;
  cv.addEventListener('mousedown', ev => { arr = true; moveu = 0; lx = ev.offsetX; ly = ev.offsetY;
    cv.classList.add('drag'); });
  window.addEventListener('mouseup', () => { arr = false; cv.classList.remove('drag'); });
  cv.addEventListener('mousemove', ev => {
    const x = ev.offsetX, y = ev.offsetY;
    if (arr) {
      moveu += Math.abs(x - lx) + Math.abs(y - ly);
      GM.lon -= (x - lx) / (Math.cos(rad(GM.lat)) * GM.k);
      GM.lat += (y - ly) / GM.k; lx = x; ly = y;
      gmDesenha(); $('#mtip').style.display = 'none'; return;
    }
    const h = gmHit(x, y), tip = $('#mtip');
    if (h) {
      tip.innerHTML = '<b>' + h.p.n + '. ' + esc(h.p.nome) + '</b>' +
        '<span class="l">' + esc(h.p.id) + ' · ' + esc(h.p.tipo) +
          (h.p.m ? ' · ' + h.p.m + ' m' : '') + '</span>' +
        '<span class="l">' + (h.p.dPrev ? '+' + gmDist(h.p.dPrev) + ' da anterior · ' : '') +
          gmDist(h.p.dAc) + ' acumulados</span>';
      const r = cv.getBoundingClientRect();
      tip.style.left = Math.min(r.left + x + 14, window.innerWidth - 262) + 'px';
      tip.style.top = (r.top + y + 14) + 'px'; tip.style.display = 'block';
      cv.style.cursor = 'pointer';
    } else { tip.style.display = 'none'; cv.style.cursor = arr ? 'grabbing' : 'grab'; }
  });
  cv.addEventListener('mouseleave', () => { $('#mtip').style.display = 'none'; });
  cv.addEventListener('click', ev => {
    if (moveu > 4) return;
    const h = gmHit(ev.offsetX, ev.offsetY); if (!h) return;
    ST.gmPonto = ST.gmPonto === h.p.id ? null : h.p.id; render();
  });
  cv.addEventListener('wheel', ev => {
    ev.preventDefault();
    const fz = ev.deltaY < 0 ? 1.2 : 1 / 1.2;
    const la = GM.lat - (ev.offsetY - GM.h / 2) / GM.k;
    const lo = GM.lon + (ev.offsetX - GM.w / 2) / (Math.cos(rad(GM.lat)) * GM.k);
    GM.k = Math.max(2500, Math.min(900000, GM.k * fz));
    GM.lat = la + (GM.h / 2 - ev.offsetY) / GM.k;
    GM.lon = lo - (ev.offsetX - GM.w / 2) / (Math.cos(rad(GM.lat)) * GM.k);
    gmDesenha();
  }, { passive:false });
}
function gmHit(x, y) {
  for (let i = GM.hits.length - 1; i >= 0; i--) {
    const h = GM.hits[i];
    if (Math.hypot(x - h.x, y - h.y) <= h.r) return h;
  }
  return null;
}
function gmFoco(pid) {
  const e = gmRotaAtual(); if (!e) return;
  const p = e.pontos.find(x => x.id === pid); if (!p) return;
  ST.gmPonto = pid; GM.lat = p.lat; GM.lon = p.lon;
  GM.k = Math.max(GM.k, 120000); render();
}
function gmZoom(z) {
  if (z === 'in') GM.k = Math.min(900000, GM.k * 1.4);
  else if (z === 'out') GM.k = Math.max(2500, GM.k / 1.4);
  else gmFit();
  gmDesenha();
}

  if (t.dataset.pg)   { ST.pag = t.dataset.pg; ST.busca = ''; render(true); }
  else if (t.dataset.eq)   { ST.sel = ST.sel === t.dataset.eq ? null : t.dataset.eq; MAP.foco = ST.sel; render(); }
  else if (t.dataset.al !== undefined && t.dataset.al !== '') {
    const i = +t.dataset.al; ST.alSel = i;
    const ref = ST.al[i] && ST.al[i].ref; if (ref) focar(ref); else render();
  }
  else if (t.dataset.foco) focar(t.dataset.foco);
  else if (t.dataset.dia)  { ST.data = t.dataset.dia; ST.plano = null; render(true); }
  else if (t.dataset.z)    { const z = t.dataset.z;
    if (z === 'in') MAP.k *= 1.4; else if (z === 'out') MAP.k /= 1.4; else { MAP.foco = null; fit(); }
    desenha(ST.plano, ST.est); }
  else if (t.id === 'btnPlay') { CFG.simRodando = !CFG.simRodando;
    t.textContent = CFG.simRodando ? '⏸ PAUSAR' : '▶ RETOMAR'; render(); }
  else if (t.id === 'btnVel') { CFG.simVel = CFG.simVel === 1 ? 5 : CFG.simVel === 5 ? 20 : 1;
    t.textContent = CFG.simVel + '×'; }
  else if (t.id === 'btnLimpa') { ST.fFrente = ST.fEquipe = ST.fStatus = ''; ST.busca = ''; ST.sel = null; render(true); }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'selPapel') { ST.papel = el.value;
    if (!pode(ST.papel, 'editarItinerario')) { ST.editMapa = false; ST.edEquipe = ST.edItin = null; }
    aviso('Perfil: ' + (PAPEIS.find(p => p.id === ST.papel) || {}).desc, 'cy');
    return render(true); }
  if (el.id === 'gmRota') { ST.gmRota = el.value; ST.gmPonto = null; GM.fit = true; return render(); }
  if (el.dataset.at) return acAtividade(ST.data, 'set',
    { id:el.dataset.at, campos:{ [el.dataset.campo]:el.value } });
  if (el.dataset.mv)    { const d = el.value; if (d) acDesigna(ST.data, el.dataset.mv, d); return; }
  if (el.dataset.desig) { const d = el.value; if (d) acDesigna(ST.data, el.dataset.desig, d); return; }
  if (el.id === 'fData')   { ST.data = el.value; ST.plano = null; ST.sel = null; render(true); }
  else if (el.id === 'fFrente') { ST.fFrente = el.value; render(true); }
  else if (el.id === 'fEquipe') { ST.fEquipe = el.value; render(true); }
  else if (el.id === 'fStatus') { ST.fStatus = el.value; render(true); }
  else if (el.dataset.ly !== undefined) { LON[el.dataset.ly] = el.checked; desenha(ST.plano, ST.est); }
  else if (el.dataset.cfg) { const v = parseFloat(el.value);
    if (isFinite(v) && v >= 0) { CFG[el.dataset.cfg] = v; render(); } }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'qponto') { ST.buscaPonto = ev.target.value;
    $('#gaveta').innerHTML = gaveta();
    const el = $('#qponto'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    return; }
  if (ev.target.id !== 'qbusca') return;
  ST.busca = ev.target.value;
  if (ST.pag === 'dash') buscaMapa(); else render();
});
function buscaMapa() {
  const q = ST.busca.trim().toLowerCase(), box = $('#mres'); if (!box) return;
  if (q.length < 2) { box.style.display = 'none'; return; }
  const res = [];
  ST.plano.equipes.forEach(e => { if (e.nome.toLowerCase().includes(q) || e.rota.toLowerCase().includes(q))
    res.push(['equipe', e.nome + ' · ' + e.rota, e.id]); });
  D.quadrantes.forEach(x => { if (x.id.toLowerCase().includes(q) || x.bairro.toLowerCase().includes(q))
    res.push(['quad', x.id + ' · ' + x.bairro, null, x.cent]); });
  D.ruas.forEach(x => { if (res.length < 40 && x.nome.toLowerCase().includes(q))
    res.push(['rua', x.nome + ' · ' + x.quad, null, [x.lat, x.lon]]); });
  D.feiras.concat(D.semaforos).forEach(x => { const n = x.nome || x.cruzamento;
    if (res.length < 60 && (n.toLowerCase().includes(q) || x.id.toLowerCase().includes(q)))
      res.push([x.tipo || 'semáforo', x.id + ' · ' + n, null, [x.lat, x.lon]]); });
  box.innerHTML = res.slice(0, 25).map((r, i) => '<button data-res="' + i + '">' +
    '<span class="tag t-gy" style="margin-right:6px">' + r[0] + '</span>' + esc(r[1]) + '</button>').join('')
    || '<div class="empty tiny">Nada encontrado.</div>';
  box.style.display = 'block';
  box.querySelectorAll('[data-res]').forEach(b => b.onclick = () => {
    const r = res[+b.dataset.res];
    if (r[2]) focar(r[2]);
    else { MAP.cy = r[3][0]; MAP.cx = r[3][1]; MAP.k = Math.max(MAP.k, 14000); desenha(ST.plano, ST.est); }
    box.style.display = 'none';
  });
}
/* -------------------- despacho das ações de administração -------------------- */
function acao(el) {
  const iso = el.dataset.iso || ST.data, id = el.dataset.id, ac = el.dataset.ac;
  switch (ac) {
    case 'confirmar': return acConfirmar(iso);
    case 'liberar':   return acLiberar(iso);
    case 'reabrir':   return acReabrir(iso);
    case 'ir':        ST.data = iso; ST.plano = null; ST.pag = 'prog'; return render(true);
    case 'novaeq':    return acNovaEquipe(iso, el.dataset.fr);
    case 'edeq':      ST.edItin = null; ST.edEquipe = id; return render();
    case 'editin':    ST.edEquipe = null; ST.edItin = id; ST.buscaPonto = ''; return render();
    case 'fechagav':  ST.edEquipe = null; ST.edItin = null; return render();
    case 'rmeq':      return acRemoveEquipe(ST.data, id);
    case 'restaura':  return acRestauraEquipe(ST.data, id);
    case 'up':        return acMovePonto(ST.data, id, +el.dataset.i, -1);
    case 'dn':        return acMovePonto(ST.data, id, +el.dataset.i, +1);
    case 'rmpt':      return acRemovePonto(ST.data, id, el.dataset.pid);
    case 'addpt':     return acAddPonto(ST.data, id, el.dataset.pid);
    case 'desig':     return acDesigna(ST.data, ST.selPonto, el.dataset.destino);
    case 'fechapt':   ST.selPonto = null; return render();
    case 'gmz':    return gmZoom(el.dataset.gz);
    case 'gmpt':   ST.gmPonto = ST.gmPonto === el.dataset.pid ? null : el.dataset.pid; return render();
    case 'gmfoco': return gmFoco(el.dataset.pid);
    case 'gmtog':  ST[el.dataset.tg] = !ST[el.dataset.tg]; return render();
    case 'print':       return imprimir(iso, el.dataset.ids ? el.dataset.ids.split(',') : null);
    case 'tentarprint': return tentarImprimir();
    case 'fechafolha':  limpaFolhas(); return render();
    case 'addat':     return acAtividade(ST.data, 'add', {});
    case 'delat':     return acAtividade(ST.data, 'del', { id });
    case 'salvaeq': {
      const membros = ($('#eqMembros').value || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
      return acSalvaEquipe(ST.data, id, { nome:$('#eqNome').value.trim() || id,
        membros, ini:$('#eqIni').value.trim(), fim:$('#eqFim').value.trim(),
        pessoas:parseInt($('#eqPes').value, 10) || 2, obs:$('#eqObs').value });
    }
  }
}
window.addEventListener('resize', () => { if (ST.pag === 'dash') desenha(ST.plano, ST.est);
  if (ST.pag === 'gmapa') montaGMapa(); });

/* ---------------------------- RELÓGIO ---------------------------- */
setInterval(() => {
  if (!CFG.simRodando) return;
  ST.hora += CFG.simVel;
  if (ST.hora > 22 * 60) ST.hora = 5 * 60 + 30;
  const leve = ['dash','divisao','rotas','equipes','alertas','rel'].includes(ST.pag);
  if (leve) render();
  else { recalcula(); navRender(); $('#topHora').textContent = min2hm(ST.hora);
         if (ST.pag === 'gmapa' && GM.ctx) gmDesenha(); }
}, 1000);

/* ------------------------------ BOOT ------------------------------ */
(function boot() {
  carregaEdicoes();
  /* Semeadura de demonstração, feita uma única vez: o dia de hoje já liberado
     (para a torre abrir com a operação no ar) e o de amanhã montado aguardando
     confirmação. Qualquer edição do admin sobrescreve isto e fica salva. */
  if (!EDIT.__semeado) {
    const h = diaEdit(HOJE);
    if (h.estado === 'PROPOSTA' && !h.log.length) {
      h.estado = 'LIBERADO'; h.versao = 1; h.confirmadoEm = '07:40'; h.liberadoEm = '07:52';
      h.log.push({ hora:'07:52', papel:'admin', acao:'LIBERADO PARA A RUA', detalhe:'versão 1 às 07:52' },
                 { hora:'07:40', papel:'admin', acao:'DIA CONFIRMADO', detalhe:'versão 1' });
    }
    diaEdit(amanhaDe(HOJE));
    EDIT.__semeado = true; salvaEdicoes();
  }
  ST.plano = planoDoDia(ST.data);
  render(true);
})();

</script>
